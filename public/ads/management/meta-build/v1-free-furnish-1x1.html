<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0a0a0a; }
  body { font-family: "Inter Tight", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<main style="width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a;">
  <header style="position:absolute;top:38px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;z-index:5;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:10px;height:10px;background:#f5c518;border-radius:50%;"></div>
      <div style="font-size:21px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#fff;">Mandel Realty Group</div>
    </div>
    <div style="font-size:19px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.55);">Toronto</div>
  </header>

  <section style="position:absolute;top:90px;left:0;right:0;height:560px;display:flex;overflow:hidden;">
    <div style="position:relative;width:50%;height:100%;overflow:hidden;">
      <img src="../before-room.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 55%;filter:saturate(.22) brightness(.66) contrast(.95);">
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,10,.35),rgba(10,10,10,.15) 45%,rgba(10,10,10,.9) 100%);"></div>
      <div style="position:absolute;top:28px;left:32px;font-size:17px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.72);">Before</div>
    </div>
    <div style="position:relative;width:50%;height:100%;overflow:hidden;">
      <img src="../after-room.jpg" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%;filter:saturate(1.05) brightness(1.02) contrast(1.06);">
      <div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,10,10,.18),rgba(10,10,10,.02) 40%,rgba(10,10,10,.85) 100%);"></div>
      <div style="position:absolute;top:28px;right:32px;font-size:17px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#f5c518;">After</div>
    </div>
    <div style="position:absolute;top:0;bottom:0;left:50%;width:4px;margin-left:-2px;background:#f5c518;"></div>
    <div style="position:absolute;left:0;right:0;bottom:0;height:190px;background:linear-gradient(to bottom,rgba(10,10,10,0),#0a0a0a);"></div>
  </section>

  <div style="position:absolute;top:498px;right:58px;width:174px;height:174px;z-index:6;transform:rotate(-11deg);">
    <div style="width:100%;height:100%;border-radius:50%;background:#f5c518;box-shadow:0 24px 60px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;">
      <div style="width:150px;height:150px;border-radius:50%;border:3px dashed rgba(10,10,10,.42);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;">
        <div style="font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(10,10,10,.7);">Furnishing</div>
        <div style="font-size:56px;line-height:.9;font-weight:800;letter-spacing:-.045em;color:#0a0a0a;">FREE</div>
        <div style="font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:rgba(10,10,10,.7);">$0 upfront</div>
      </div>
    </div>
  </div>

  <section style="position:absolute;left:64px;right:64px;bottom:42px;display:flex;flex-direction:column;gap:16px;">
    <div style="font-size:16px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#f5c518;">For hosts who already have an Airbnb</div>
    <h1 style="font-size:68px;line-height:.94;font-weight:800;letter-spacing:-.04em;color:#fff;">WE'LL FURNISH YOUR AIRBNB. <span style="color:#f5c518;">FREE.</span></h1>
    <p style="font-size:25px;line-height:1.32;font-weight:500;color:#c4c4c4;">Help you earn <span style="color:#fff;font-weight:700;">2-3X more</span>. No cost to you.</p>
    <div style="display:flex;align-items:center;gap:26px;margin-top:6px;">
      <div style="background:#f5c518;color:#0a0a0a;font-size:22px;font-weight:700;padding:17px 36px;border-radius:999px;white-space:nowrap;">Claim My Free Makeover</div>
      <div style="font-size:18px;line-height:1.35;font-weight:400;color:#9a9a9a;">No catch.<br>Spots limited this quarter.</div>
    </div>
  </section>
</main>
</body>
</html>
