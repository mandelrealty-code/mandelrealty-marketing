<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #0a0a0a; }
  body { font-family: "Inter Tight", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<main style="width:1080px;height:1080px;position:relative;overflow:hidden;background:#0a0a0a;">
  <img src="../condo-bedroom.png" alt="" style="position:absolute;top:0;left:0;width:1080px;height:470px;object-fit:cover;object-position:center 42%;">
  <div style="position:absolute;top:0;left:0;width:1080px;height:470px;background:linear-gradient(to bottom,rgba(10,10,10,.28) 0%,rgba(10,10,10,.08) 38%,rgba(10,10,10,.55) 78%,#0a0a0a 100%);"></div>

  <header style="position:absolute;top:36px;left:64px;right:64px;display:flex;align-items:center;justify-content:space-between;z-index:5;">
    <div style="display:flex;align-items:center;gap:12px;">
      <div style="width:10px;height:10px;background:#f5c518;border-radius:50%;"></div>
      <div style="font-size:21px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#fff;text-shadow:0 1px 18px rgba(10,10,10,.55);">Mandel Realty Group</div>
    </div>
    <div style="font-size:19px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);text-shadow:0 1px 18px rgba(10,10,10,.55);">Toronto</div>
  </header>

  <section style="position:absolute;left:64px;right:64px;bottom:40px;display:flex;flex-direction:column;gap:14px;">
    <div style="font-size:16px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#f5c518;">Already making money on Airbnb?</div>
    <h1 style="font-size:58px;line-height:.92;font-weight:800;letter-spacing:-.04em;text-transform:uppercase;color:#fff;">Keep Your<br>Airbnb Income.</h1>
    <p style="font-size:24px;line-height:1.28;font-weight:500;color:#c4c4c4;">We only get paid <span style="color:#fff;font-weight:700;">if we grow it.</span></p>

    <div style="display:flex;background:#141414;border:1px solid #2a2a2a;border-radius:18px;overflow:hidden;">
      <div style="flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#6f6f6f;">Your current income</div>
        <div style="font-size:22px;line-height:1.2;font-weight:700;color:#fff;">Locked in. 100% yours.</div>
      </div>
      <div style="width:1px;background:#2a2a2a;margin:12px 0;"></div>
      <div style="flex:1;padding:22px 26px;display:flex;flex-direction:column;gap:8px;">
        <div style="font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#f5c518;">Anything we add</div>
        <div style="font-size:22px;line-height:1.2;font-weight:700;color:#f5c518;">That's how we get paid.</div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:22px;margin-top:4px;">
      <div style="background:#f5c518;color:#0a0a0a;font-size:20px;font-weight:700;padding:14px 32px;border-radius:999px;white-space:nowrap;">Get My Growth Plan</div>
      <div style="font-size:17px;line-height:1.35;font-weight:400;color:#9a9a9a;">Full management.<br>You get your time back.</div>
    </div>
  </section>
</main>
</body>
</html>
