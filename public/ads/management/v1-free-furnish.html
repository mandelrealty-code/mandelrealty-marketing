<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1350px; overflow: hidden; background: #0a0a0a; }
  body { font-family: 'Inter Tight', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div style="width:1080px; height:1350px; position:relative; overflow:hidden; background:#0a0a0a;">

  <!-- Brand bar -->
  <div style="position:absolute; top:52px; left:64px; right:64px; display:flex; align-items:center; justify-content:space-between; z-index:5;">
    <div style="display:flex; align-items:center; gap:12px;">
      <div style="width:10px; height:10px; background:#f5c518; border-radius:50%;"></div>
      <div style="font-size:21px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:#ffffff;">Mandel Realty Group</div>
    </div>
    <div style="font-size:19px; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; color:rgba(255,255,255,0.55);">Toronto</div>
  </div>

  <!-- Before / After split -->
  <div style="position:absolute; top:118px; left:0; right:0; height:748px; display:flex; overflow:hidden;">
    <div style="position:relative; width:50%; height:100%; overflow:hidden;">
      <img src="./before-room.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 55%; filter:saturate(0.22) brightness(0.66) contrast(0.95);" />
      <div style="position:absolute; inset:0; background:linear-gradient(to bottom, rgba(10,10,10,0.35) 0%, rgba(10,10,10,0.15) 45%, rgba(10,10,10,0.85) 100%);"></div>
      <div style="position:absolute; top:28px; left:32px; font-size:17px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:rgba(255,255,255,0.72);">Before</div>
    </div>
    <div style="position:relative; width:50%; height:100%; overflow:hidden;">
      <img src="./after-room.jpg" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 45%; filter:saturate(1.05) brightness(1.02) contrast(1.06);" />
      <div style="position:absolute; inset:0; background:linear-gradient(to bottom, rgba(10,10,10,0.18) 0%, rgba(10,10,10,0.02) 40%, rgba(10,10,10,0.8) 100%);"></div>
      <div style="position:absolute; top:28px; right:32px; font-size:17px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase; color:#f5c518;">After</div>
    </div>
    <div style="position:absolute; top:0; bottom:0; left:50%; width:4px; margin-left:-2px; background:#f5c518;"></div>
    <div style="position:absolute; left:0; right:0; bottom:0; height:150px; background:linear-gradient(to bottom, rgba(10,10,10,0) 0%, #0a0a0a 100%);"></div>
  </div>

  <!-- FREE stamp -->
  <div style="position:absolute; top:672px; right:70px; width:212px; height:212px; z-index:6; transform:rotate(-11deg);">
    <div style="width:100%; height:100%; border-radius:50%; background:#f5c518; box-shadow:0 24px 60px rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center;">
      <div style="width:184px; height:184px; border-radius:50%; border:3px dashed rgba(10,10,10,0.42); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;">
        <div style="font-size:15px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:rgba(10,10,10,0.7);">Furnishing</div>
        <div style="font-size:70px; line-height:0.9; font-weight:800; letter-spacing:-0.045em; color:#0a0a0a;">FREE</div>
        <div style="font-size:15px; font-weight:700; letter-spacing:0.2em; text-transform:uppercase; color:rgba(10,10,10,0.7);">$0 upfront</div>
      </div>
    </div>
  </div>

  <!-- Copy block -->
  <div style="position:absolute; left:64px; right:64px; bottom:64px; display:flex; flex-direction:column; gap:26px;">
    <div style="font-size:18px; font-weight:600; letter-spacing:0.2em; text-transform:uppercase; color:#f5c518;">For hosts who already have an Airbnb</div>

    <h1 style="font-size:82px; line-height:0.94; font-weight:800; letter-spacing:-0.04em; color:#ffffff;">WE'LL FURNISH YOUR AIRBNB. <span style="color:#f5c518;">FREE.</span></h1>

    <p style="font-size:30px; line-height:1.32; font-weight:500; color:#c4c4c4;">Help you earn <span style="color:#ffffff; font-weight:700;">2-3X more</span>. No cost to you.</p>

    <div style="display:flex; align-items:center; gap:26px; margin-top:6px;">
      <div style="background:#f5c518; color:#0a0a0a; font-size:26px; font-weight:700; padding:22px 46px; border-radius:999px; white-space:nowrap;">Claim My Free Makeover</div>
      <div style="font-size:20px; line-height:1.35; font-weight:400; color:#9a9a9a;">No catch.<br />Spots limited this quarter.</div>
    </div>
  </div>

</div>
</body>
</html>
