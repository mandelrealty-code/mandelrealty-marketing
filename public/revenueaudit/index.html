<script>
(function () {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function resolve(expr, data, scope) {
    expr = String(expr || "").trim();
    if (expr === "true") return true;
    if (expr === "false") return false;
    if (!expr) return "";
    var parts = expr.split(".");
    var cur;
    if (scope && Object.prototype.hasOwnProperty.call(scope, parts[0])) cur = scope[parts[0]];
    else cur = data[parts[0]];
    for (var i = 1; i < parts.length; i++) {
      if (cur == null) return "";
      cur = cur[parts[i]];
    }
    return cur === undefined || cur === null ? "" : cur;
  }

  function findMatchingClose(html, tag, fromIdx) {
    var tokenRe = new RegExp("<(/)?" + tag + "\\b[^>]*>", "g");
    tokenRe.lastIndex = fromIdx;
    var depth = 0;
    var m;
    while ((m = tokenRe.exec(html))) {
      if (m[1]) {
        depth--;
        if (depth === 0) return { start: m.index, end: m.index + m[0].length };
      } else {
        depth++;
      }
    }
    return null;
  }

  function interpolate(html, data, scope) {
    html = html.replace(/\s+hint-placeholder-[a-z-]+=\"[^\"]*\"/g, "");
    html = html.replace(/\sonClick=\"\{\{\s*([^}]+?)\s*\}\}\"/g, ' data-dc-click="$1"');
    html = html.replace(/\sonChange=\"\{\{\s*([^}]+?)\s*\}\}\"/g, ' data-dc-change="$1"');
    html = html.replace(/\sstyle-hover=\"([^\"]*)\"/g, ' data-style-hover="$1"');
    return html.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (_, expr) {
      var v = resolve(expr, data, scope);
      if (typeof v === "function") return "";
      if (typeof v === "boolean") return v ? "true" : "";
      return escapeHtml(v);
    });
  }

  function process(html, data, scope) {
    var out = "";
    var i = 0;
    while (i < html.length) {
      var nextFor = html.indexOf("<sc-for", i);
      var nextIf = html.indexOf("<sc-if", i);
      var next = -1;
      var kind = null;
      if (nextFor === -1 && nextIf === -1) {
        out += interpolate(html.slice(i), data, scope);
        break;
      }
      if (nextFor === -1 || (nextIf !== -1 && nextIf < nextFor)) {
        next = nextIf;
        kind = "sc-if";
      } else {
        next = nextFor;
        kind = "sc-for";
      }
      out += interpolate(html.slice(i, next), data, scope);
      var gt = html.indexOf(">", next);
      if (gt === -1) {
        out += html.slice(next);
        break;
      }
      var openTag = html.slice(next, gt + 1);
      var close = findMatchingClose(html, kind, next);
      if (!close) {
        out += openTag;
        i = gt + 1;
        continue;
      }
      var inner = html.slice(gt + 1, close.start);
      if (kind === "sc-if") {
        var vm = openTag.match(/value=\"\{\{\s*([^}]+?)\s*\}\}\"/);
        var val = vm ? resolve(vm[1], data, scope) : false;
        if (val) out += process(inner, data, scope);
      } else {
        var lm = openTag.match(/list=\"\{\{\s*([^}]+?)\s*\}\}\"/);
        var am = openTag.match(/\sas=\"([^\"]+)\"/);
        var list = lm ? resolve(lm[1], data, scope) : [];
        var as = am ? am[1] : "item";
        var arr = Array.isArray(list) ? list : [];
        for (var j = 0; j < arr.length; j++) {
          var childScope = Object.assign({}, scope);
          childScope[as] = arr[j];
          out += process(inner, data, childScope);
        }
      }
      i = close.end;
    }
    return out;
  }

  function unescapeStyles(html) {
    return html.replace(/style=\"([^\"]*)\"/g, function (_, css) {
      var u = css
        .replace(/&quot;/g, '"')
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&amp;/g, "&");
      return 'style="' + u.replace(/"/g, "&quot;") + '"';
    });
  }

  function bindHovers(root) {
    root.querySelectorAll("[data-style-hover]").forEach(function (el) {
      var hover = el.getAttribute("data-style-hover") || "";
      var base = el.getAttribute("style") || "";
      el.addEventListener("mouseenter", function () {
        var map = {};
        (base + ";" + hover).split(";").forEach(function (part) {
          var idx = part.indexOf(":");
          if (idx === -1) return;
          var k = part.slice(0, idx).trim();
          var v = part.slice(idx + 1).trim();
          if (k) map[k] = v;
        });
        el.setAttribute(
          "style",
          Object.keys(map)
            .map(function (k) {
              return k + ": " + map[k];
            })
            .join("; ")
        );
      });
      el.addEventListener("mouseleave", function () {
        el.setAttribute("style", base);
      });
    });
  }

  function bindEvents(root, data) {
    root.querySelectorAll("[data-dc-click]").forEach(function (el) {
      var name = el.getAttribute("data-dc-click");
      var fn = data[name];
      if (typeof fn === "function") {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          fn(e);
        });
      }
    });
    root.querySelectorAll("[data-dc-change]").forEach(function (el) {
      var name = el.getAttribute("data-dc-change");
      var fn = data[name];
      if (typeof fn === "function") {
        el.addEventListener("input", function (e) {
          fn(e);
        });
        el.addEventListener("change", function (e) {
          fn(e);
        });
      }
    });
  }

  function restoreFields(root, vals) {
    if (!vals) return;
    Object.keys(vals).forEach(function (name) {
      var el = root.querySelector('[name="' + name + '"]');
      if (!el) return;
      if (el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.tagName === "INPUT") {
        el.value = vals[name] == null ? "" : String(vals[name]);
      }
    });
  }

  class DCLogic {
    constructor(root, template, props) {
      this.root = root;
      this.template = template;
      this.props = props || {};
      this.state = {};
      this.vals = {};
    }
    setState(patch, cb) {
      var next = typeof patch === "function" ? patch(this.state) : patch;
      Object.assign(this.state, next);
      this.render();
      if (typeof cb === "function") cb();
    }
    render() {
      var y = window.scrollY;
      var active = document.activeElement;
      var activeName = active && active.getAttribute && active.getAttribute("name");
      var selStart = active && active.selectionStart;
      var selEnd = active && active.selectionEnd;
      var data = this.renderVals();
      var html = unescapeStyles(process(this.template, data, {}));
      this.root.innerHTML = html;
      bindEvents(this.root, data);
      bindHovers(this.root);
      restoreFields(this.root, this.vals);
      if (activeName) {
        var el = this.root.querySelector('[name="' + activeName + '"]');
        if (el) {
          el.focus();
          try {
            if (selStart != null) el.setSelectionRange(selStart, selEnd);
          } catch (_) {}
        }
      }
      window.scrollTo(0, y);
    }
    mount() {
      this.render();
    }
  }

  globalThis.DCLogic = DCLogic;
  if (typeof window !== "undefined") window.DCLogic = DCLogic;
})();

</script>

        setTimeout(() => this.setState({ buying: false, offer: 0, unlocked: true, unlockNote: "Unlocked · $24.99 paid (50% off)" }), 900);
      },
      buy1999: () => {
        this.setState({ buying: true });
        setTimeout(() => this.setState({ buying: false, offer: 0, unlocked: true, unlockNote: "Unlocked · $19.99 paid (60% off)" }), 900);
      },
      onCode: e => { this.vals.code = e.target.value; },
      submitCode: () => {
        this.syncFields();
        const ok = String(this.vals.code || "").trim().toUpperCase() === "MRGVIP2026";
        this.setState(ok
          ? { unlocked: true, offer: 0, codeMsg: "", unlockNote: "Unlocked with access code MRGVIP2026" }
          : { codeMsg: "That code is not valid. Check it with MRG, or unlock below." });
      },
      callUnlock: () => this.setState({ unlocked: true, offer: 0, unlockNote: "Unlocked for your free 15-min call — no charge" }),
      isLive,
      isNew: !isLive,
      audited: this.state.audited,
      hasRevenue: this.state.audited && base > 0,
      pending: this.state.audited && base <= 0,
      tiers,
      gapAnnual: this.money(gap),
      gapMonthly: this.money(gap / 12),
      livePathStyle: this.pathCard(isLive),
      newPathStyle: this.pathCard(!isLive),
      liveDotStyle: this.dot(isLive),
      newDotStyle: this.dot(!isLive),
      pullLabel: this.state.pulling ? "Pulling comps…" : (this.state.pulled ? "Market data pulled ✓" : "Pull live market data"),
      onField: e => { this.vals[e.target.name] = e.target.value; },
      pickLive: () => this.setState({ path: "live" }),
      pickNew: () => this.setState({ path: "notlisted" }),
      runAudit: () => {
        this.syncFields();
        this.setState({ audited: true, revenue: this.parseRev(this.vals.revenue) }, () => {
          const el = document.getElementById("summary");
          if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: "smooth" });
        });
      },
      pullData: () => {
        if (this.state.pulling) return;
        this.syncFields();
        this.setState({ pulling: true });
        setTimeout(() => {
          const demo = this.parseRev(this.vals.revenue) || 3400;
          this.vals.revenue = String(demo);
          this.setState({ pulling: false, pulled: true, audited: true, revenue: demo });
        }, 1100);
      }
    };
  }
}

globalThis.Component = Component;

-size: 14.5px; line-height: 1.45; font-weight: 500; color: #333; padding-left: 18px; border-left: 2px solid #cdeeeb\">High ratings across all six categories: check-in, cleanliness, accuracy, communication, location, value</li>\n          <li style=\"font-size: 14.5px; line-height: 1.45; font-weight: 500; color: #333; padding-left: 18px; border-left: 2px solid #cdeeeb\">Cancellations and quality-related service issues under 1% on average</li>\n          <li style=\"font-size: 14.5px; line-height: 1.45; font-weight: 500; color: #333; padding-left: 18px; border-left: 2px solid #cdeeeb\">Low review-removal rate</li>\n        </ul>\n      </div>\n    </div>\n\n    <div style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px\">\n      <div style=\"background: #f7f7f7; border-radius: 18px; padding: 22px\">\n        <div style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: #d90b41\">+29%</div>\n        <div style=\"font-size: 13.5px; font-weight: 600; color: #5e5e5e; margin-top: 6px; line-height: 1.4\">More annual revenue for Superhosts vs. comparable non-Superhosts</div>\n      </div>\n      <div style=\"background: #f7f7f7; border-radius: 18px; padding: 22px\">\n        <div style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: #d90b41\">52%</div>\n        <div style=\"font-size: 13.5px; font-weight: 600; color: #5e5e5e; margin-top: 6px; line-height: 1.4\">Higher click-through rate on Guest Favorite listings</div>\n      </div>\n      <div style=\"background: #f7f7f7; border-radius: 18px; padding: 22px\">\n        <div style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.03em; color: #d90b41\">23% vs 9%</div>\n        <div style=\"font-size: 13.5px; font-weight: 600; color: #5e5e5e; margin-top: 6px; line-height: 1.4\">Booking conversion, Guest Favorite vs. not</div>\n      </div>\n      <div style=\"background: #f7f7f7; border-radius: 18px; padding: 22px\">\n       <div style=\"background: #fff0f3; border: 1px solid #ffd3dd; border-radius: 20px; padding: 28px\">\n            <div style=\"font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 10px\">The MRG Furniture Program</div>\n            <p style=\"margin: 0 0 18px; font-size: 15.5px; line-height: 1.6; color: #7a2338; max-width: 68ch; text-wrap: pretty\">MRG funds the furniture and d\u00e9cor refresh. $0 upfront from you, you keep the furniture, and it is tied to a 24-month management term \u2014 no vesting schedule, no buyback.</p>\n            <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px\">\n              <div style=\"background: #ffffff; border-radius: 14px; padding: 16px; font-size: 14px; font-weight: 700; color: #222\">$0 upfront</div>\n              <div style=\"background: #ffffff; border-radius: 14px; padding: 16px; font-size: 14px; font-weight: 700; color: #222\">You keep the furniture</div>\n              <div style=\"background: #ffffff; border-radius: 14px; padding: 16px; font-size: 14px; font-weight: 700; color: #222\">24-month management term</div>\n              <div style=\"background: #ffffff; border-radius: 14px; padding: 16px; font-size: 14px; font-weight: 700; color: #222\">No vesting, no buyback</div>\n            </div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n              <a href=\"tel:+16473817325\" style=\"background: #ff385c; color: #fff; font-size: 15px; font-weight: 700; border-radius: 13px; padding: 14px 24px\" style-hover=\"background: #e00b41; color: #fff; text-decoration: none\">Apply for the furniture program</a>\n              <span style=\"font-size: 13px; font-weight: 600; color: #8f2440\">Also included: photo markup on your current set, and your Superhost / Guest Favorite checklist.</span>\n            </div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"margin-top: 84px\">\n    <h2 style=\"margin: 0 0 10px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">Visibility hosts do not get</h2>\n    <p style=\"margin: 0 0 24px; font-size: 16.5px; line-height: 1.55; color: #5e5e5e; max-width: 76ch; text-wrap: pretty\">Airbnb tracks far more than the public star rating. Once MRG manages the property, that data is visible to us \u2014 and it becomes your monthly report.</p>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px\">\n      <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"12\">\n        <div style=\"background: #f7f7f7; border-radius: 14px; padding: 16px 18px; font-size: 14px; font-weight: 700; color: #333\">{{ m }}</div>\n      </sc-for>\n    </div>\n    <div style=\"margin-top: 16px; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n      <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 18px; padding: 24px\">\n        <div style=\"font-size: 12px; font-weight: 800; color: #d90b41; margin-bottom: 10px\">STEP 1</div>\n        <div style=\"font-size: 16.5px; font-weight: 700\">What needs improvement</div>\n      </div>\n      <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 18px; padding: 24px\">\n        <div style=\"font-size: 12px; font-weight: 800; color: #d90b41; margin-bottom: 10px\">STEP 2</div>\n        <div style=\"font-size: 16.5px; font-weight: 700\">What MRG changed</div>\n      </div>\n      <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 18px; padding: 24px\">\n        <div style=\"font-size: 12px; font-weight: 800; color: #d90b41; margin-bottom: 10px\">STEP 3</div>\n        <div style=\"font-size: 16.5px; font-weight: 700\">What it actually did</div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"margin-top: 76px\">\n    <h2 style=\"margin: 0 0 26px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">Guest experience that runs itself</h2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px\">\n      <sc-for list=\"{{ guest }}\" as=\"g\" hint-placeholder-count=\"7\">\n        <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 18px; padding: 22px; box-shadow: 0 6px 20px rgba(0,0,0,0.04)\">\n          <div style=\"font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 7px; line-height: 1.35\">{{ g.t }}</div>\n          <div style=\"font-size: 14px; font-weight: 500; color: #5e5e5e; line-height: 1.5\">{{ g.d }}</div>\n        </div>\n      </sc-for>\n    </div>\n  </section>\n\n  <section style=\"margin-top: 76px\">\n    <h2 style=\"margin: 0 0 26px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">Why MRG runs this, not just reports it</h2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px\">\n      <sc-for list=\"{{ why }}\" as=\"w\" hint-placeholder-count=\"5\">\n        <div style=\"background: #f7f7f7; border-radius: 18px; padding: 22px\">\n          <div style=\"font-size: 16px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 7px; line-height: 1.35\">{{ w.t }}</div>\n          <div style=\"font-size: 14px; font-weight: 500; color: #5e5e5e; line-height: 1.5\">{{ w.d }}</div>\n        </div>\n      </sc-for>\n    </div>\n  </section>\n\n  <section style=\"margin-top: 76px\">\n    <h2 style=\"margin: 0 0 26px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">This is already running</h2>\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px\">\n      <sc-for list=\"{{ listings }}\" as=\"l\" hint-placeholder-count=\"4\">\n        <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 18px; padding: 2 to MRG and we will walk your specific listing, line by line, on a free 15-minute call.</p>\n      </div>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-start\">\n        <button type=\"button\" onClick=\"{{ runAudit }}\" style=\"background: #ffffff; color: #222; border: none; font-size: 16px; font-weight: 700; border-radius: 14px; padding: 16px 26px; cursor: pointer\" style-hover=\"background: #f0f0f0\">Send my request to MRG</button>\n        <a href=\"tel:+16473817325\" style=\"background: rgba(0,0,0,0.22); color: #fff; font-size: 16px; font-weight: 700; border-radius: 14px; padding: 16px 26px\" style-hover=\"background: rgba(0,0,0,0.35); color: #fff; text-decoration: none\">Book the free call</a>\n      </div>\n    </div>\n    <footer style=\"margin-top: 34px; padding-top: 26px; border-top: 1px solid #ebebeb; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 24px\">\n      <div>\n        <div style=\"font-size: 15px; font-weight: 700; margin-bottom: 6px\">Mandel Realty Group \u00b7 Revenue Audit</div>\n        <div style=\"font-size: 13.5px; font-weight: 600; color: #5e5e5e; line-height: 1.6\">\n          <a href=\"tel:+16473817325\">(647) 381-7325</a><br />\n          <a href=\"mailto:info@mandelrealtygroup.com\">info@mandelrealtygroup.com</a>\n        </div>\n      </div>\n      <div style=\"font-size: 12.5px; color: #8a8a8a; font-weight: 500; line-height: 1.6\">Projections draw on AirROI market data, the revenue you entered, and Toronto baselines. MRG reviews every figure before it is presented as a plan. Airbnb badge criteria come from Airbnb; revenue, click-through and conversion statistics come from independent analyses. Nothing is sent to MRG until you press \u201cSend my request\u201d.</div>\n    </footer>\n  </section>\n\n  <sc-if value=\"{{ offer1 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 20px\">\n      <div style=\"background: #ffffff; border-radius: 24px; padding: clamp(24px, 4vw, 36px); max-width: 440px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,0.35)\">\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #fff0f3; color: #d90b41; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 800; margin-bottom: 16px\">50% off \u00b7 today only</div>\n        <div style=\"font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; margin-bottom: 10px\">Take half off your full audit</div>\n        <p style=\"margin: 0 0 20px; font-size: 15px; line-height: 1.55; color: #5e5e5e\">Same complete audit, same call, half the price. One property, one-time.</p>\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px\">\n          <span style=\"font-size: 36px; font-weight: 800; letter-spacing: -0.035em\">$24.99</span>\n          <span style=\"font-size: 17px; font-weight: 600; color: #b0b0b0; text-decoration: line-through\">$49.99</span>\n        </div>\n        <button type=\"button\" onClick=\"{{ buy2499 }}\" style=\"width: 100%; background: #ff385c; color: #fff; border: none; font-size: 16px; font-weight: 700; border-radius: 14px; padding: 16px; cursor: pointer\" style-hover=\"background: #e00b41\">Unlock for $24.99</button>\n        <button type=\"button\" onClick=\"{{ declineOffer }}\" style=\"width: 100%; margin-top: 10px; background: transparent; color: #717171; border: none; font-size: 14.5px; font-weight: 700; padding: 12px; cursor: pointer\" style-hover=\"color: #222222\">No thanks</button>\n      </div>\n    </div>\n  </sc-if>\n\n  <sc-if value=\"{{ offer2 }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; padding: 20px\">\n      <div style=\"background: #222222; color: #fff; border-radius: 24px; padding: clamp(24px, 4vw, 36px); max-width: 440px; width: 100%; box-shadow: 0 30px 80px rgba(0,0,0,0.45)\">\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #3a2b30; color: #ff8fa4; border-radius: 999px; padding: 7px 14px; font-size: 12.5px; font-weight: 800; margin-bottom: 16px\">Last chance \u00b7 60% off</div>\n        <div style=\"font-size: 26px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.15; margin-bottom: 10px\">Final offer on this audit</div>\n        <p style=\"margin: 0 0 20px; font-size: 15px; line-height: 1.55; color: #c4c4c4\">This is the lowest MRG goes. After this the page keeps the free preview only.</p>\n        <div style=\"display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px\">\n          <span style=\"font-size: 36px; font-weight: 800; letter-spacing: -0.035em\">$19.99</span>\n          <span style=\"font-size: 17px; font-weight: 600; color: #8a8a8a; text-decoration: line-through\">$49.99</span>\n        </div>\n        <button type=\"button\" onClick=\"{{ buy1999 }}\" style=\"width: 100%; background: #ff385c; color: #fff; border: none; font-size: 16px; font-weight: 700; border-radius: 14px; padding: 16px; cursor: pointer\" style-hover=\"background: #e00b41\">Unlock for $19.99</button>\n        <button type=\"button\" onClick=\"{{ callUnlock }}\" style=\"width: 100%; margin-top: 10px; background: transparent; color: #fff; border: 1px solid #5a5a5a; font-size: 15px; font-weight: 700; border-radius: 12px; padding: 14px; cursor: pointer\" style-hover=\"border-color: #ffffff\">Book the free call instead \u2014 MRG unlocks it</button>\n        <button type=\"button\" onClick=\"{{ closeOffer }}\" style=\"width: 100%; margin-top: 8px; background: transparent; color: #8a8a8a; border: none; font-size: 14px; font-weight: 700; padding: 10px; cursor: pointer\" style-hover=\"color: #ffffff\">Maybe later</button>\n      </div>\n    </div>\n  </sc-if>\n\n</div>";
  var props = {"moderateUplift": 1.3, "optimizedUplift": 1.85};
