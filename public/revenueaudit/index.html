<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Revenue Audit · Mandel Realty Group</title>
<meta name="description" content="Free Airbnb revenue audit from Mandel Realty Group — see comps, gaps, and a clear plan." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #ffffff; }
  * { box-sizing: border-box; }
  body { font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; color: #222222; }
  a { color: #e00b41; text-decoration: none; }
  a:hover { color: #b00832; text-decoration: underline; }
  input, select, textarea, button { font-family: inherit; }
  input::placeholder, textarea::placeholder { color: #b0b0b0; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #222222 !important; box-shadow: 0 0 0 3px rgba(34,34,34,0.08); }

  .ra-proof {
    position: relative;
    margin: 40px calc(50% - 50vw) 0;
    width: 100vw;
    background: transparent;
    color: #ffffff;
    padding: 0;
    font-family: "Plus Jakarta Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  .ra-proof-wave {
    display: block;
    width: 100%;
    height: clamp(48px, 8vw, 88px);
    margin: 0;
    line-height: 0;
  }
  .ra-proof-band {
    background: #0a0a0a;
    padding: 8px 20px 72px;
    margin-top: -1px;
  }
  .ra-proof-inner { max-width: 1120px; margin: 0 auto; }
  .ra-proof h2 {
    margin: 0 0 16px;
    font-family: inherit;
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.12;
    color: #ffffff;
  }
  .ra-proof-lead {
    margin: 0 0 28px;
    max-width: 72ch;
    font-size: 15.5px;
    font-weight: 500;
    line-height: 1.6;
    color: rgba(255,255,255,0.78);
    text-wrap: pretty;
  }
  .ra-proof-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
  }
  @media (max-width: 980px) {
    .ra-proof-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    .ra-proof-grid { grid-template-columns: 1fr; }
  }
  .ra-proof-card {
    background: #161616;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .ra-proof-card img {
    width: 100%;
    aspect-ratio: 629 / 448;
    object-fit: cover;
    object-position: top center;
    display: block;
    background: #222;
  }
  .ra-proof-body {
    padding: 14px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .ra-proof-badge {
    align-self: flex-start;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 6px 11px;
    border-radius: 999px;
    background: #e8c547;
    color: #1a1400;
  }
  .ra-proof-stats {
    display: flex;
    gap: 16px;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.72);
  }
  .ra-proof-stats b {
    font-family: inherit;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    color: #ffffff;
    margin-right: 4px;
  }
  .ra-proof-meta {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
  }
  .ra-proof-note {
    margin: 18px 0 0;
    font-size: 12.5px;
    font-weight: 500;
    line-height: 1.5;
    color: rgba(255,255,255,0.45);
    max-width: 70ch;
  }
  .ra-proof-closing {
    margin: 22px 0 0;
    font-size: 17px;
    font-weight: 600;
    line-height: 1.55;
    color: #ffffff;
    max-width: 68ch;
    text-wrap: pretty;
  }

  .ra-live-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; grid-column: 1 / -1; }
  @media (max-width: 640px) {
    .ra-live-pair { grid-template-columns: 1fr; }
  }

  @keyframes mrgRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes mrgShimmer { from { background-position: -420px 0; } to { background-position: 420px 0; } }
  .ra-stack-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(238px, 1fr)); gap: 16px; align-items: stretch; }
  .ra-badge-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); }
  @media (max-width: 720px) {
    .ra-badge-row > div:first-child { border-right: none !important; border-bottom: 1px solid inherit; }
  }
  @media (max-width: 640px) {
    .ra-leak-row {
      flex-direction: column !important;
      gap: 14px !important;
      padding: 22px 18px !important;
    }
    .ra-leaks-head { padding: 16px 18px !important; }
    .ra-leak-rank { flex-direction: row !important; align-items: center !important; width: auto !important; gap: 10px !important; }
    .ra-leak-rank > div:last-child { width: 28px !important; }
    .ra-leak-metric { max-width: none !important; min-width: 0 !important; width: 100% !important; }
    .ra-rating-row { grid-template-columns: 1fr !important; gap: 8px !important; }
    .ra-ratings [data-binding="subject.overallRating"] { font-size: 44px !important; }
  }
</style>
<style>
  html { scroll-behavior: smooth; }
  sc-for, sc-if { display: contents; }
  a[data-dc-click], button { -webkit-tap-highlight-color: transparent; }
  #basics { scroll-margin-top: 24px; }
  @media (max-width: 720px) {
    .ra-full-comp-row { grid-template-columns: 72px 1fr !important; }
    .ra-full-comp-row > :nth-child(3),
    .ra-full-comp-row > :nth-child(4) { grid-column: 1 / -1; }
  }
</style>

<script>
(function () {
  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function resolve(expr, data, scope) {
    expr = String(expr || "").trim();
    if (expr === "true") return true;
    if (expr === "false") return false;
    if (!expr) return "";
    var parts = expr.split(".");
    var cur;
    if (scope && Object.prototype.hasOwnProperty.call(scope, parts[0])) cur = scope[parts[0]];
    else cur = data[parts[0]];
    for (var i = 1; i < parts.length; i++) {
      if (cur == null) return "";
      cur = cur[parts[i]];
    }
    return cur === undefined || cur === null ? "" : cur;
  }

  function findMatchingClose(html, tag, fromIdx) {
    var tokenRe = new RegExp("<(/)?" + tag + "\\b[^>]*>", "g");
    tokenRe.lastIndex = fromIdx;
    var depth = 0;
    var m;
    while ((m = tokenRe.exec(html))) {
      if (m[1]) {
        depth--;
        if (depth === 0) return { start: m.index, end: m.index + m[0].length };
      } else {
        depth++;
      }
    }
    return null;
  }

  function interpolate(html, data, scope) {
    html = html.replace(/\s+hint-placeholder-[a-z-]+=\"[^\"]*\"/g, "");
    html = html.replace(/\sonClick=\"\{\{\s*([^}]+?)\s*\}\}\"/g, ' data-dc-click="$1"');
    html = html.replace(/\sonChange=\"\{\{\s*([^}]+?)\s*\}\}\"/g, ' data-dc-change="$1"');
    html = html.replace(/\sstyle-hover=\"([^\"]*)\"/g, ' data-style-hover="$1"');
    return html.replace(/\{\{\s*([^}]+?)\s*\}\}/g, function (_, expr) {
      var v = resolve(expr, data, scope);
      if (typeof v === "function") return "";
      if (typeof v === "boolean") return v ? "true" : "";
      return escapeHtml(v);
    });
  }

  function process(html, data, scope) {
    var out = "";
    var i = 0;
    while (i < html.length) {
      var nextFor = html.indexOf("<sc-for", i);
      var nextIf = html.indexOf("<sc-if", i);
      var next = -1;
      var kind = null;
      if (nextFor === -1 && nextIf === -1) {
        out += interpolate(html.slice(i), data, scope);
        break;
      }
      if (nextFor === -1 || (nextIf !== -1 && nextIf < nextFor)) {
        next = nextIf;
        kind = "sc-if";
      } else {
        next = nextFor;
        kind = "sc-for";
      }
      out += interpolate(html.slice(i, next), data, scope);
      var gt = html.indexOf(">", next);
      if (gt === -1) {
        out += html.slice(next);
        break;
      }
      var openTag = html.slice(next, gt + 1);
      var close = findMatchingClose(html, kind, next);
      if (!close) {
        out += openTag;
        i = gt + 1;
        continue;
      }
      var inner = html.slice(gt + 1, close.start);
      if (kind === "sc-if") {
        var vm = openTag.match(/value=\"\{\{\s*([^}]+?)\s*\}\}\"/);
        var val = vm ? resolve(vm[1], data, scope) : false;
        if (val) out += process(inner, data, scope);
      } else {
        var lm = openTag.match(/list=\"\{\{\s*([^}]+?)\s*\}\}\"/);
        var am = openTag.match(/\sas=\"([^\"]+)\"/);
        var list = lm ? resolve(lm[1], data, scope) : [];
        var as = am ? am[1] : "item";
        var arr = Array.isArray(list) ? list : [];
        for (var j = 0; j < arr.length; j++) {
          var childScope = Object.assign({}, scope);
          childScope[as] = arr[j];
          out += process(inner, data, childScope);
        }
      }
      i = close.end;
    }
    return out;
  }

  function unescapeStyles(html) {
    return html.replace(/style=\"([^\"]*)\"/g, function (_, css) {
      var u = css
        .replace(/&quot;/g, '"')
        .replace(/&lt;/g, "<")
        .replace(/&gt;/g, ">")
        .replace(/&amp;/g, "&");
      return 'style="' + u.replace(/"/g, "&quot;") + '"';
    });
  }

  function bindHovers(root) {
    root.querySelectorAll("[data-style-hover]").forEach(function (el) {
      var hover = el.getAttribute("data-style-hover") || "";
      var base = el.getAttribute("style") || "";
      el.addEventListener("mouseenter", function () {
        var map = {};
        (base + ";" + hover).split(";").forEach(function (part) {
          var idx = part.indexOf(":");
          if (idx === -1) return;
          var k = part.slice(0, idx).trim();
          var v = part.slice(idx + 1).trim();
          if (k) map[k] = v;
        });
        el.setAttribute(
          "style",
          Object.keys(map)
            .map(function (k) {
              return k + ": " + map[k];
            })
            .join("; ")
        );
      });
      el.addEventListener("mouseleave", function () {
        el.setAttribute("style", base);
      });
    });
  }

  function bindEvents(root, data) {
    root.querySelectorAll("[data-dc-click]").forEach(function (el) {
      var name = el.getAttribute("data-dc-click");
      var fn = data[name];
      if (typeof fn === "function") {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          fn(e);
        });
      }
    });
    root.querySelectorAll("[data-dc-change]").forEach(function (el) {
      var name = el.getAttribute("data-dc-change");
      var fn = data[name];
      if (typeof fn === "function") {
        el.addEventListener("input", function (e) {
          fn(e);
        });
        el.addEventListener("change", function (e) {
          fn(e);
        });
      }
    });
  }

  function restoreFields(root, vals) {
    if (!vals) return;
    Object.keys(vals).forEach(function (name) {
      var el = root.querySelector('[name="' + name + '"]');
      if (!el) return;
      if (el.tagName === "SELECT" || el.tagName === "TEXTAREA" || el.tagName === "INPUT") {
        el.value = vals[name] == null ? "" : String(vals[name]);
      }
    });
  }

  class DCLogic {
    constructor(root, template, props) {
      this.root = root;
      this.template = template;
      this.props = props || {};
      this.state = {};
      this.vals = {};
    }
    setState(patch, cb) {
      var next = typeof patch === "function" ? patch(this.state) : patch;
      Object.assign(this.state, next);
      this.render();
      if (typeof cb === "function") cb();
    }
    render() {
      var y = window.scrollY;
      var active = document.activeElement;
      var activeName = active && active.getAttribute && active.getAttribute("name");
      var selStart = active && active.selectionStart;
      var selEnd = active && active.selectionEnd;
      var data = this.renderVals();
      var html = unescapeStyles(process(this.template, data, {}));
      this.root.innerHTML = html;
      bindEvents(this.root, data);
      bindHovers(this.root);
      restoreFields(this.root, this.vals);
      if (activeName) {
        var el = this.root.querySelector('[name="' + activeName + '"]');
        if (el) {
          el.focus();
          try {
            if (selStart != null) el.setSelectionRange(selStart, selEnd);
          } catch (_) {}
        }
      }
      window.scrollTo(0, y);
    }
    mount() {
      this.render();
    }
  }

  globalThis.DCLogic = DCLogic;
  if (typeof window !== "undefined") window.DCLogic = DCLogic;
})();

</script>
<script>

class Component extends DCLogic {
  constructor(root, template, props) {
    super(root, template, props);
    this.state = { path: "live", audited: false, revenue: 0, pulling: false, pulled: false, unlocked: false, unlockNote: "", unlockMode: "live", offer: 0, code: "", codeMsg: "", buying: false, lastChanceUsed: false, reportId: "", liveComps: null, subject: null, leaks: null, ratings: null, paidPack: null, enrichingPaid: false, fieldErrors: {} };
    this.vals = {};
    this.placeLat = null;
    this.placeLng = null;
    this._placesTimer = null;
    this._placesReq = 0;
    this._placesPredictions = [];
    try {
      if (sessionStorage.getItem("ra_unlocked") === "1") {
        this.state.unlocked = true;
        this.state.unlockNote = sessionStorage.getItem("ra_unlock_note") || "Unlocked";
        const mode = sessionStorage.getItem("ra_unlock_mode");
        if (mode === "mock" || mode === "live") this.state.unlockMode = mode;
        this.state.offer = 0;
        this.state.lastChanceUsed = true;
      }
    } catch (_) {}
  }

  render() {
    super.render();
    this.wirePlacesDropdown();
  }

  clearPlaceGeo() {
    this.placeLat = null;
    this.placeLng = null;
  }

  hidePlacesDropdown() {
    const dd = this.root && this.root.querySelector("#ra-places-dd");
    if (!dd) return;
    dd.style.display = "none";
    dd.innerHTML = "";
  }

  renderPlacesDropdown(predictions) {
    const dd = this.root && this.root.querySelector("#ra-places-dd");
    if (!dd) return;
    this._placesPredictions = Array.isArray(predictions) ? predictions : [];
    if (!this._placesPredictions.length) {
      this.hidePlacesDropdown();
      return;
    }
    dd.innerHTML = this._placesPredictions.map((p, i) => {
      const main = (p.structured_formatting && p.structured_formatting.main_text) || p.description || "";
      const secondary = (p.structured_formatting && p.structured_formatting.secondary_text) || "";
      return '<button type="button" data-place-idx="' + i + '" role="option" style="display:block;width:100%;text-align:left;border:0;background:#fff;padding:12px 14px;cursor:pointer;border-bottom:1px solid #f0f0f0">'
        + '<div style="font-size:14px;font-weight:600;color:#222;line-height:1.35">' + String(main).replace(/</g, "&lt;") + '</div>'
        + (secondary ? ('<div style="font-size:12px;color:#717171;margin-top:2px;line-height:1.35">' + String(secondary).replace(/</g, "&lt;") + '</div>') : '')
        + '</button>';
    }).join("");
    dd.style.display = "block";
    dd.querySelectorAll("[data-place-idx]").forEach((btn) => {
      btn.addEventListener("mousedown", (e) => {
        e.preventDefault();
        const idx = parseInt(btn.getAttribute("data-place-idx") || "-1", 10);
        const pred = this._placesPredictions[idx];
        if (pred) this.selectPlacePrediction(pred);
      });
    });
  }

  async fetchPlacePredictions(input) {
    const reqId = ++this._placesReq;
    try {
      const res = await fetch("/api/audit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ op: "places", action: "autocomplete", input })
      });
      const data = await res.json().catch(() => ({}));
      if (reqId !== this._placesReq) return;
      if (data.error || !Array.isArray(data.predictions)) {
        this.hidePlacesDropdown();
        return;
      }
      const list = data.predictions.filter((p) => p && (p.place_id || p.description)).slice(0, 6);
      this.renderPlacesDropdown(list);
    } catch (_) {
      if (reqId === this._placesReq) this.hidePlacesDropdown();
    }
  }

  async selectPlacePrediction(pred) {
    const placeId = pred && pred.place_id;
    const fallback = (pred && pred.description) || "";
    if (!placeId) {
      this.vals.address = fallback;
      this.clearPlaceGeo();
      this.hidePlacesDropdown();
      this.render();
      return;
    }
    try {
      const res = await fetch("/api/audit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ op: "places", action: "details", placeId })
      });
      const data = await res.json().catch(() => ({}));
      const place = data && data.place ? data.place : null;
      if (place && place.formatted_address) {
        this.vals.address = place.formatted_address;
        this.placeLat = place.latitude != null ? Number(place.latitude) : null;
        this.placeLng = place.longitude != null ? Number(place.longitude) : null;
        if (this.state.fieldErrors && this.state.fieldErrors.address) {
          const next = Object.assign({}, this.state.fieldErrors);
          delete next.address;
          this.setState({ fieldErrors: next });
        } else {
          this.render();
        }
      } else {
        this.vals.address = fallback;
        this.clearPlaceGeo();
        this.render();
      }
    } catch (_) {
      this.vals.address = fallback;
      this.clearPlaceGeo();
      this.render();
    }
    this.hidePlacesDropdown();
  }

  wirePlacesDropdown() {
    if (!this.root || this.state.path !== "notlisted") return;
    const input = this.root.querySelector('input[name="address"]');
    if (!input || input.dataset.placesWired === "1") return;
    input.dataset.placesWired = "1";
    input.addEventListener("blur", () => {
      setTimeout(() => this.hidePlacesDropdown(), 180);
    });
  }

  onAddressInput(e) {
    const key = e.target.name;
    const value = e.target.value;
    this.vals[key] = value;
    this.clearPlaceGeo();
    if (this.state.fieldErrors && this.state.fieldErrors[key]) {
      const next = Object.assign({}, this.state.fieldErrors);
      delete next[key];
      this.setState({ fieldErrors: next });
    }
    if (this._placesTimer) clearTimeout(this._placesTimer);
    const q = String(value || "").trim();
    if (q.length < 3) {
      this.hidePlacesDropdown();
      return;
    }
    this._placesTimer = setTimeout(() => this.fetchPlacePredictions(q), 220);
  }

  money(n) {
    return "$" + Math.round(n).toLocaleString("en-US");
  }

  parseRev(raw) {
    const n = parseFloat(String(raw || "").replace(/[^0-9.]/g, ""));
    return isFinite(n) && n > 0 ? n : 0;
  }


  isAirbnbListing(raw) {
    const s = String(raw || "").trim();
    if (!s) return false;
    if (/^\d{5,}$/.test(s)) return true;
    return Boolean(
      s.match(/airbnb\.[^/\s]+\/rooms\/\d+/i) ||
      s.match(/\/rooms\/\d+/i) ||
      s.match(/[?&]listing_id=\d+/i)
    );
  }

  inputBorderStyle(hasError, extra) {
    const border = hasError ? "#ff385c" : "#dddddd";
    const glow = hasError ? "; box-shadow: 0 0 0 3px rgba(255,56,92,0.16)" : "";
    return "width: 100%; border: 1.5px solid " + border + "; border-radius: 12px; padding: 13px 15px; font-size: 15px; color: #222; background: #fff" + glow + (extra || "");
  }

  validateAuditFields() {
    this.syncFields();
    const errors = {};
    const name = String(this.vals.name || "").trim();
    const phone = String(this.vals.phone || "").replace(/\D/g, "");
    const email = String(this.vals.email || "").trim();
    if (!name) errors.name = true;
    if (phone.length < 10) errors.phone = true;
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.email = true;

    if (this.state.path === "live") {
      const listing = String(this.vals.listing || "").trim();
      if (!this.isAirbnbListing(listing)) errors.listing = true;
      if (!this.parseRev(this.vals.revenue)) errors.revenue = true;
    } else {
      if (!String(this.vals.address || "").trim()) errors.address = true;
    }

    const labels = {
      name: "name",
      phone: "phone",
      email: "email",
      listing: "Airbnb listing link",
      revenue: "current monthly revenue",
      address: "property address"
    };
    const missing = Object.keys(errors).map((k) => labels[k] || k);
    let message = "";
    if (missing.length === 1) message = "Add your " + missing[0] + " to continue.";
    else if (missing.length > 1) message = "Fill in the highlighted fields to continue: " + missing.join(", ") + ".";
    return { ok: missing.length === 0, errors, message };
  }

  focusFirstError(errors) {
    const order = ["name", "phone", "email", "listing", "revenue", "address"];
    const first = order.find((k) => errors[k]);
    const basics = document.getElementById("basics");
    if (basics) window.scrollTo({ top: basics.getBoundingClientRect().top + window.scrollY - 24, behavior: "smooth" });
    if (!first || !this.root) return;
    const el = this.root.querySelector('[name="' + first + '"]');
    if (el) setTimeout(() => { try { el.focus(); } catch (_) {} }, 280);
  }

  finishAuditView(opts) {
    const o = opts || {};
    this.setState({
      pulling: false,
      pulled: Boolean(o.pulled),
      audited: true,
      revenue: Number(o.revenue) || 0,
      liveComps: o.liveComps !== undefined ? o.liveComps : this.state.liveComps,
      subject: o.subject !== undefined ? o.subject : this.state.subject,
      leaks: o.leaks !== undefined ? o.leaks : this.state.leaks,
      ratings: o.ratings !== undefined ? o.ratings : this.state.ratings,
      fieldErrors: {}
    }, () => {
      const el = document.getElementById("summary");
      if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 24, behavior: "smooth" });
      if (String(this.vals.email || "").includes("@")) {
        this.saveAndEmail(this.state.unlocked ? "code" : "preview");
      }
      if (this.state.unlocked || this.alreadyUnlocked()) this.loadPaidPack();
    });
  }

  startAudit() {
    if (this.state.pulling) return;
    const check = this.validateAuditFields();
    if (!check.ok) {
      this.setState({ fieldErrors: check.errors }, () => this.focusFirstError(check.errors));
      this.showToast(check.message);
      return;
    }
    this.setState({ pulling: true, fieldErrors: {} });
    const typedRev = this.parseRev(this.vals.revenue);
    const money = (n) => "$" + Math.round(Number(n) || 0).toLocaleString("en-US");
    const mapComp = (c, i) => {
      const monthlyNum = c.monthlyRevenue != null ? c.monthlyRevenue : (c.annualRevenue != null ? c.annualRevenue / 12 : null);
      const badge = c.guestFavorite ? "Guest favorite" : (c.superhost ? "Superhost" : "");
      const beds = c.bedrooms != null ? (c.bedrooms + "BR") : "";
      const baths = c.bathrooms != null ? (c.bathrooms + "BA") : "";
      const area = c.locality || c.name || ("Comp " + String.fromCharCode(65 + i));
      const title = [beds, baths, area].filter(Boolean).join(" · ") || area;
      const dist = c.distanceMiles != null ? (Number(c.distanceMiles).toFixed(1) + " mi away") : "";
      const sleeps = (c.guests != null && c.guests !== "") ? ("Sleeps " + c.guests) : "";
      const meta = [dist, sleeps].filter(Boolean).join(" · ") || "Nearby comparable";
      const diffs = Array.isArray(c.diffs) && c.diffs.length ? c.diffs.join(" · ") : (c.diff || "Live market listing nearby");
      return {
        listingId: c.listingId || "",
        title,
        name: c.name || title,
        meta,
        badge,
        hasBadge: Boolean(badge),
        rating: c.ratingOverall != null ? String(c.ratingOverall) : "",
        hasRating: c.ratingOverall != null,
        monthlyNum: monthlyNum != null ? Number(monthlyNum) : null,
        monthly: monthlyNum != null ? money(monthlyNum) : "$—",
        occupancy: c.occupancy != null && Number(c.occupancy) > 0 ? Number(c.occupancy) : null,
        adr: c.adr != null && Number(c.adr) > 0 ? Number(c.adr) : null,
        delta: "",
        diff: diffs,
        diffs,
        lockedTeaser: diffs,
        photoUrl: c.photoUrl || "",
        delay: (0.06 + i * 0.09).toFixed(2) + "s"
      };
    };
    const finishLocal = () => {
      if (!typedRev) {
        this.setState({ pulling: false });
        this.showToast("Enter your current monthly revenue, or paste an Airbnb URL for a live pull.");
        return;
      }
      this.vals.revenue = String(Math.round(typedRev));
      this.finishAuditView({ pulled: false, revenue: typedRev, liveComps: null, subject: this.state.subject, leaks: null, ratings: null });
      this.showToast("Audit ready from your numbers. Live comps will appear when market data is available.");
    };
    const body = this.state.path === "notlisted"
      ? {
          op: "estimate",
          address: this.vals.address || "",
          bedrooms: parseInt(String(this.vals.bedrooms || "2"), 10) || 2,
          bathrooms: parseFloat(String(this.vals.bathrooms || "1")) || 1,
          latitude: this.placeLat,
          longitude: this.placeLng
        }
      : {
          op: "lookup",
          listingUrl: this.vals.listing || "",
          includeComps: true
        };
    fetch("/api/audit", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(async (res) => {
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) throw new Error(data.error || "unavailable");
      const rawComps = Array.isArray(data.comps) ? data.comps : [];
      let liveComps = rawComps.map(mapComp).filter((c) => c.title);
      // Prefer comps that have cover photos when available
      const withPhotos = liveComps.filter((c) => c.photoUrl);
      if (withPhotos.length >= 3) liveComps = withPhotos;
      liveComps = liveComps.slice(0, 12);
      let subject = data.subject && typeof data.subject === "object" ? {
        photoUrl: data.subject.photoUrl || "",
        superhost: Boolean(data.subject.superhost),
        guestFavorite: Boolean(data.subject.guestFavorite),
        topTenPercent: Boolean(data.subject.topTenPercent || data.subject.top10Percent || data.subject.rareFind),
        monthlyRevenue: data.subject.monthlyRevenue != null ? data.subject.monthlyRevenue : null,
        adr: data.subject.adr != null ? data.subject.adr : null,
        occupancy: data.subject.occupancy != null ? data.subject.occupancy : null,
        bedrooms: data.subject.bedrooms != null ? data.subject.bedrooms : null,
        bathrooms: data.subject.bathrooms != null ? data.subject.bathrooms : null,
        guests: data.subject.guests != null ? data.subject.guests : null,
        latitude: data.subject.latitude != null ? data.subject.latitude : null,
        longitude: data.subject.longitude != null ? data.subject.longitude : null,
        listingId: data.subject.listingId || "",
        ratingOverall: data.subject.ratingOverall != null ? data.subject.ratingOverall : null,
        ratingCleanliness: data.subject.ratingCleanliness != null ? data.subject.ratingCleanliness : null,
        ratingCommunication: data.subject.ratingCommunication != null ? data.subject.ratingCommunication : null,
        ratingAccuracy: data.subject.ratingAccuracy != null ? data.subject.ratingAccuracy : null,
        ratingCheckin: data.subject.ratingCheckin != null ? data.subject.ratingCheckin : null,
        ratingValue: data.subject.ratingValue != null ? data.subject.ratingValue : null,
        ratingLocation: data.subject.ratingLocation != null ? data.subject.ratingLocation : null,
        reviewCount: data.subject.reviewCount != null ? data.subject.reviewCount : null,
        photosCount: data.subject.photosCount != null ? data.subject.photosCount : null,
        name: data.subject.name || ""
      } : null;
      if (!subject && this.state.path === "notlisted") {
        const lat = data.latitude != null ? Number(data.latitude) : (this.placeLat != null ? Number(this.placeLat) : null);
        const lng = data.longitude != null ? Number(data.longitude) : (this.placeLng != null ? Number(this.placeLng) : null);
        subject = {
          photoUrl: "",
          superhost: false,
          guestFavorite: false,
          topTenPercent: false,
          monthlyRevenue: data.monthlyRevenue != null ? data.monthlyRevenue : null,
          adr: data.adr != null ? data.adr : null,
          occupancy: data.occupancy != null ? data.occupancy : null,
          bedrooms: parseInt(String(this.vals.bedrooms || "2"), 10) || 2,
          bathrooms: parseFloat(String(this.vals.bathrooms || "1")) || 1,
          guests: null,
          latitude: Number.isFinite(lat) ? lat : null,
          longitude: Number.isFinite(lng) ? lng : null,
          listingId: "",
          ratingOverall: null,
          ratingCleanliness: null,
          ratingCommunication: null,
          ratingAccuracy: null,
          ratingCheckin: null,
          ratingValue: null,
          ratingLocation: null,
          reviewCount: null,
          photosCount: null,
          name: String(this.vals.address || "").trim()
        };
      }
      const subjectRev = subject && subject.monthlyRevenue != null ? subject.monthlyRevenue : null;
      const estRev = data.monthlyRevenue != null ? data.monthlyRevenue : null;
      const rev = typedRev || subjectRev || estRev || 0;
      if (!rev) throw new Error("No trailing revenue returned for this listing. Enter your monthly revenue manually.");
      const liveLeaks = Array.isArray(data.leaks)
        ? this.enrichLeaks(data.leaks).filter((l) => l.title && l.body)
        : [];
      const ratings = data.ratings && typeof data.ratings === "object" ? data.ratings : null;
      this.vals.revenue = String(Math.round(rev));
      this.finishAuditView({
        pulled: true,
        revenue: Number(rev) || 0,
        liveComps: liveComps.length ? liveComps : null,
        subject,
        leaks: liveLeaks.length ? liveLeaks : null,
        ratings
      });
      this.showToast(liveComps.length
        ? ("Audit ready — loaded " + liveComps.length + " nearby comps with listing photos.")
        : "Audit ready. Nearby comps will appear when market data is available.");
    }).catch(() => finishLocal());
  }



  syncFields() {
    if (!this.root) return;
    this.root.querySelectorAll("input[name], select[name], textarea[name]").forEach((el) => {
      if (el.name) this.vals[el.name] = el.value;
    });
  }

  card(bg, border, color, glow) {
    return "background: " + bg + "; border: 1px solid " + border + "; border-radius: 20px; padding: 26px; color: " + color + (glow ? "; box-shadow: 0 14px 34px rgba(255,56,92,0.28)" : "") + ";";
  }

  pill(bg, color) {
    return "font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; background: " + bg + "; color: " + color + "; border-radius: 999px; padding: 5px 10px; white-space: nowrap;";
  }

  pathCard(active) {
    return "cursor: pointer; border-radius: 18px; padding: 20px 22px; background: #ffffff; border: 1.5px solid " + (active ? "#222222" : "#e4e4e4") + "; box-shadow: " + (active ? "0 8px 24px rgba(0,0,0,0.09)" : "0 1px 2px rgba(0,0,0,0.03)") + "; transition: border-color .15s, box-shadow .15s;";
  }

  dot(active) {
    return "width: 20px; height: 20px; border-radius: 999px; flex: none; border: " + (active ? "6px solid #ff385c" : "1.5px solid #cccccc") + "; background: #fff; transition: border .15s;";
  }



  showToast(msg) {
    let el = document.getElementById("ra-toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "ra-toast";
      el.setAttribute("role", "status");
      el.style.cssText = "position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:80;max-width:min(920px,calc(100vw - 32px));background:#222;color:#fff;font-size:14px;font-weight:600;line-height:1.45;padding:14px 18px;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.28);";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.style.display = "block";
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => { el.style.display = "none"; }, 5600);
  }

  async saveAndEmail(unlockMethod) {
    this.syncFields();
    const email = String(this.vals.email || "").trim();
    if (!email || !email.includes("@")) {
      this.showToast("Add your email in Step 1 so we can send your private report link.");
      return null;
    }
    const method = unlockMethod || (this.state.unlocked ? "code" : "preview");
    const unlocked = method !== "preview" ? true : Boolean(this.state.unlocked);
    try {
      const res = await fetch("/api/audit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          op: "save_report",
          email,
          name: String(this.vals.name || "").trim(),
          phone: String(this.vals.phone || "").trim(),
          unlocked,
          unlockMethod: method,
          unlockNote: this.state.unlockNote || "",
          reportId: this.state.reportId || undefined,
          path: this.state.path,
          listingUrl: this.vals.listing || "",
          address: this.vals.address || "",
          earnings: this.vals.revenue || String(this.state.revenue || ""),
          payload: {
            path: this.state.path,
            revenue: this.state.revenue,
            unlocked,
            unlockNote: this.state.unlockNote || "",
            vals: Object.assign({}, this.vals),
            leaks: Array.isArray(this.state.leaks) ? this.state.leaks : [],
            ratings: this.state.ratings || null,
            subject: this.state.subject || null,
            liveComps: Array.isArray(this.state.liveComps) ? this.state.liveComps : [],
            paidPack: this.state.paidPack || null,
            unlockMode: this.state.unlockMode || "live"
          }
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.id) {
        this.showToast(data.error || "Could not email your report link. Try again or call MRG.");
        return null;
      }
      this.setState({ reportId: data.id });
      if (unlocked) {
        try {
          sessionStorage.setItem("ra_unlocked", "1");
          sessionStorage.setItem("ra_exit_offer_shown", "1");
          if (this.state.unlockMode) sessionStorage.setItem("ra_unlock_mode", this.state.unlockMode);
          if (this.state.unlockNote) sessionStorage.setItem("ra_unlock_note", String(this.state.unlockNote));
          if (data.id) localStorage.setItem("ra_unlocked_" + data.id, "1");
        } catch (_) {}
      }
      try {
        const u = new URL(window.location.href);
        u.searchParams.set("r", data.id);
        history.replaceState({}, "", u.toString());
      } catch (_) {}
      if (data.emailed) {
        this.showToast(unlocked
          ? ("Full report link emailed to " + email)
          : ("Preview link emailed to " + email));
      } else {
        this.showToast(data.warning || ("Saved your report. We will email " + email + " shortly."));
      }
      return data.id;
    } catch (_) {
      this.showToast("Network error — could not send your report email.");
      return null;
    }
  }

  async loadFromQuery() {
    let token = "";
    try { token = new URLSearchParams(window.location.search).get("r") || ""; } catch (_) {}
    if (!token) return;
    try {
      const res = await fetch("/api/audit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ op: "load_report", token })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) return;
      const payload = data.payload && typeof data.payload === "object" ? data.payload : {};
      const vals = Object.assign({}, payload.vals || {});
      if (data.name) vals.name = data.name;
      if (data.email) vals.email = data.email;
      if (data.phone) vals.phone = data.phone;
      this.vals = vals;
      const revenue = Number(payload.revenue) || this.parseRev(vals.revenue);
      const wasUnlocked = Boolean(data.unlocked);
      const restoredPack = payload.paidPack && typeof payload.paidPack === "object" ? payload.paidPack : null;
      const restoredMode = payload.unlockMode === "mock" ? "mock" : "live";
      this.setState({
        reportId: data.id || token,
        path: payload.path === "notlisted" ? "notlisted" : (payload.path || this.state.path || "live"),
        audited: true,
        revenue: revenue > 0 ? revenue : 0,
        unlocked: wasUnlocked || this.alreadyUnlocked(),
        unlockNote: data.unlockNote || (wasUnlocked ? "Unlocked" : ""),
        unlockMode: restoredMode,
        offer: 0,
        lastChanceUsed: wasUnlocked || this.alreadyUnlocked() ? true : this.state.lastChanceUsed,
        leaks: Array.isArray(payload.leaks) && payload.leaks.length ? this.enrichLeaks(payload.leaks) : null,
        ratings: payload.ratings && typeof payload.ratings === "object" ? payload.ratings : null,
        subject: payload.subject && typeof payload.subject === "object" ? payload.subject : this.state.subject,
        liveComps: Array.isArray(payload.liveComps) && payload.liveComps.length ? payload.liveComps : this.state.liveComps,
        paidPack: restoredPack,
        pulled: Boolean(payload.subject || (Array.isArray(payload.liveComps) && payload.liveComps.length) || payload.ratings || restoredPack)
      }, () => {
        if (wasUnlocked || this.alreadyUnlocked()) {
          try {
            sessionStorage.setItem("ra_unlocked", "1");
            sessionStorage.setItem("ra_unlock_mode", restoredMode);
            if (data.unlockNote) sessionStorage.setItem("ra_unlock_note", String(data.unlockNote));
          } catch (_) {}
          if (!restoredPack) this.loadPaidPack();
        }
      });
      this.showToast(wasUnlocked || this.alreadyUnlocked() ? "Loaded your unlocked report." : "Loaded your saved preview.");
    } catch (_) {}
  }


  rememberUnlocked(note, mode) {
    let unlockMode = mode || this.state.unlockMode || "live";
    try {
      const stored = sessionStorage.getItem("ra_unlock_mode");
      if (!mode && (stored === "mock" || stored === "live")) unlockMode = stored;
      sessionStorage.setItem("ra_unlocked", "1");
      sessionStorage.setItem("ra_exit_offer_shown", "1");
      sessionStorage.setItem("ra_unlock_mode", unlockMode);
      if (note) sessionStorage.setItem("ra_unlock_note", String(note));
      const rid = this.state.reportId;
      if (rid) localStorage.setItem("ra_unlocked_" + rid, "1");
    } catch (_) {}
    this.setState({ unlockMode, paidPack: null, enrichingPaid: false }, () => this.loadPaidPack());
  }

  async loadPaidPack() {
    if (this.state.enrichingPaid) return;
    let mode = this.state.unlockMode || "live";
    try {
      const stored = sessionStorage.getItem("ra_unlock_mode");
      if (stored === "mock" || stored === "live") mode = stored;
    } catch (_) {}
    const listing = String(this.vals.listing || "").trim();
    const subject = this.state.subject;
    if (mode === "live" && !listing && !(subject && subject.listingId)) return;
    if (mode === "live" && this.state.path === "notlisted" && !(subject && subject.latitude != null)) {
      return;
    }
    this.setState({ enrichingPaid: true, unlockMode: mode });
    try {
      const res = await fetch("/api/audit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          op: "enrich_paid",
          mode,
          listingUrl: listing || (subject && subject.listingId) || "",
          subject: subject || null,
          comps: Array.isArray(this.state.liveComps)
            ? this.state.liveComps.map((c) => ({
                listingId: c.listingId || "",
                name: c.title || c.name || "",
                monthlyRevenue: c.monthlyNum != null ? c.monthlyNum : null,
                adr: c.adr != null ? c.adr : null,
                occupancy: c.occupancy != null ? c.occupancy : null
              }))
            : []
        })
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok || !data.paidPack) throw new Error(data.error || "Paid pack unavailable");
      this.setState({ paidPack: data.paidPack, enrichingPaid: false, unlockMode: mode });
      this.showToast(mode === "mock"
        ? "Mock paid pack loaded (no AirROI cost)."
        : "Full AirROI pack loaded into your unlocked report.");
    } catch (err) {
      this.setState({ enrichingPaid: false });
      this.showToast(err && err.message ? err.message : "Could not load the full AirROI pack yet.");
    }
  }

  alreadyUnlocked() {
    if (this.state && this.state.unlocked) return true;
    try {
      if (sessionStorage.getItem("ra_unlocked") === "1") return true;
      const rid = this.state && this.state.reportId;
      if (rid && localStorage.getItem("ra_unlocked_" + rid) === "1") return true;
      const q = new URLSearchParams(window.location.search).get("r");
      if (q && localStorage.getItem("ra_unlocked_" + q) === "1") return true;
    } catch (_) {}
    return false;
  }

  bindExitIntent() {
    if (this._exitBound) return;
    this._exitBound = true;
    const trigger = () => {
      if (this.alreadyUnlocked()) return;
      try {
        if (sessionStorage.getItem("ra_exit_offer_shown") === "1") return;
      } catch (_) {}
      if (this.state.offer) return;
      if (this.state.lastChanceUsed) return;
      try { sessionStorage.setItem("ra_exit_offer_shown", "1"); } catch (_) {}
      // Strongest discount when leaving
      this.setState({ offer: 2, lastChanceUsed: true });
    };
    this._exitTrigger = trigger;

    // Desktop: cursor leaves toward the top (close / tab chrome)
    document.documentElement.addEventListener("mouseleave", (e) => {
      if (e.clientY > 12) return;
      trigger();
    });

    // Mobile / tab switch away is hard to intercept with a custom UI.
    // Catch the first browser Back gesture instead (common mobile leave path).
    try {
      if (!history.state || !history.state.raExit) {
        history.pushState({ raExit: 1 }, "", location.href);
      }
    } catch (_) {}
    window.addEventListener("popstate", () => {
      if (this.alreadyUnlocked()) return;
      try {
        if (sessionStorage.getItem("ra_exit_offer_shown") === "1") return;
      } catch (_) {}
      trigger();
      try { history.pushState({ raExit: 1 }, "", location.href); } catch (_) {}
    });

    // Soft mobile signal: page is being hidden while still unlocked (app switcher / close)
    // Show on return if they bounce back quickly? Skip — too late when hidden.
    // Instead: when user scrolls to top and pulls (overscroll) — skip, unreliable.
  }

  mount() {
    super.mount();
    this.bindExitIntent();
    this.loadFromQuery();
  }

  enrichLeaks(raw) {
    const list = Array.isArray(raw) ? raw : [];
    return list.map((l, i) => {
      const sev = i === 0
        ? { severity: "Highest impact", sevColor: "#b8072f", sevBg: "#fdeef1", rule: "#ff385c", nColor: "#222222", rowBg: "#fffafb", titleSize: "20.5px" }
        : i === 1
          ? { severity: "Elevated", sevColor: "#8a3b00", sevBg: "#fdf2e8", rule: "#e08a3c", nColor: "#222222", rowBg: "#ffffff", titleSize: "18.5px" }
          : { severity: "Moderate", sevColor: "#5e5e5e", sevBg: "#f4f4f4", rule: "#dddddd", nColor: "#717171", rowBg: "#ffffff", titleSize: "17.5px" };
      const hasMetric = l.hasMetric != null ? Boolean(l.hasMetric) : Boolean(l.metric);
      const hasTag = l.hasTag != null ? Boolean(l.hasTag) : (!hasMetric && Boolean(l.tag));
      let metricFill = l.metricFill || "";
      if (!metricFill && l.fill != null && Number.isFinite(Number(l.fill))) {
        metricFill = Math.max(8, Math.round(Number(l.fill) * 100)) + "%";
      }
      if (hasMetric && !metricFill) metricFill = "40%";
      return Object.assign({}, l, sev, {
        n: l.n || String(i + 1).padStart(2, "0"),
        key: l.key || "",
        title: l.title || "",
        body: l.body || "",
        metricLabel: l.metricLabel || "Your listing",
        metric: l.metric || "",
        vsLabel: l.vsLabel || "Benchmark",
        vs: l.vs || "",
        tag: l.tag || "",
        gapLine: l.gapLine || "",
        hasMetric,
        hasTag,
        metricFill,
        delay: (0.04 + i * 0.07).toFixed(2) + "s"
      });
    });
  }

  renderVals() {
    const isLive = this.state.path === "live";
    const base = Number(this.state.revenue) || 0;

    const liveCompsRaw = Array.isArray(this.state.liveComps) ? this.state.liveComps : [];
    const median = (nums) => {
      const a = nums.filter((n) => n != null && Number.isFinite(Number(n)) && Number(n) > 0).map(Number).sort((x, y) => x - y);
      if (!a.length) return null;
      const mid = Math.floor(a.length / 2);
      return a.length % 2 ? a[mid] : (a[mid - 1] + a[mid]) / 2;
    };
    const compMonthlies = liveCompsRaw.map((c) => c.monthlyNum != null ? Number(c.monthlyNum) : this.parseRev(c.monthly)).filter((n) => n != null && n > 0);
    const compOccs = liveCompsRaw.map((c) => c.occupancy != null ? Number(c.occupancy) : null).filter((n) => n != null && n > 0);
    const compAdrs = liveCompsRaw.map((c) => c.adr != null ? Number(c.adr) : null).filter((n) => n != null && n > 0);
    const medMonthly = median(compMonthlies);
    const topMonthly = compMonthlies.length ? Math.max(...compMonthlies) : null;
    const medOcc = median(compOccs);
    const topOcc = compOccs.length ? Math.max(...compOccs) : null;
    const medAdr = median(compAdrs);

    if (paid && Array.isArray(paid.compFutureRates)) {
      paid.compFutureRates.forEach((c, i) => {
        if (c.medianRate != null) {
          paidForwardRows.push({
            label: "Comp " + (i + 1) + " forward median",
            value: this.money(c.medianRate)
          });
        }
      });
    }
    const ps = paid && paid.pacingSummary ? paid.pacingSummary : null;
    const paidPaceRows = [];
    if (ps) {
      if (ps.avgFill != null) paidPaceRows.push({ label: "Market avg fill (next window)", value: Math.round(Number(ps.avgFill) * 100) + "%" });
      paidPaceRows.push({ label: "High-demand days (≥70% fill)", value: String(ps.highDemandDays || 0) });
      paidPaceRows.push({ label: "Soft-demand days (≤30% fill)", value: String(ps.lowDemandDays || 0) });
      paidPaceRows.push({ label: "Pacing days loaded", value: String(ps.days || 0) });
    }

    const errs = this.state.fieldErrors || {};
    return {
      ...d,
      categories: cats,
      lossRows,
      phases,
      ratingsLive,
      overallScore: ratingsOverall,
      overallMarket: ratingsMarket,
      reviewCount: ratingsReviews,
      overallFill: (function () {
        const v = Number(ratingsOverall);
        return Number.isFinite(v) ? Math.max(0, Math.min(100, (v - 4) * 100)).toFixed(1) + "%" : "0%";
      })(),
      overallMark: (function () {
        const v = Number(ratingsMarket);
        return Number.isFinite(v) ? Math.max(0, Math.min(100, (v - 4) * 100)).toFixed(1) + "%" : "0%";
      })(),
      overallInk: (function () {
        const a = Number(ratingsOverall), b = Number(ratingsMarket);
        return Number.isFinite(a) && Number.isFinite(b) && a + 0.01 < b ? "#ff385c" : "#00806f";
      })(),
      overallChip: (function () {
        const a = Number(ratingsOverall), b = Number(ratingsMarket);
        if (!(Number.isFinite(a) && Number.isFinite(b))) return "";

        return d <= -0.02 ? d.toFixed(2) + " vs comps" : (d >= 0.02 ? "+" + d.toFixed(2) + " vs comps" : "Level with comps");
      })(),
      overallChipBg: (function () {
        const a = Number(ratingsOverall), b = Number(ratingsMarket);
        return Number.isFinite(a) && Number.isFinite(b) && a + 0.01 < b ? "#fdeef1" : "#e6f5f2";
      })(),
      overallChipInk: (function () {
        const a = Number(ratingsOverall), b = Number(ratingsMarket);
        return Number.isFinite(a) && Number.isFinite(b) && a + 0.01 < b ? "#b8072f" : "#00655a";
      })(),
      overallRead: (function () {
        const a = Number(ratingsOverall), b = Number(ratingsMarket);
        const belowCount = cats.filter(c => c.below).length;
        if (!(Number.isFinite(a) && Number.isFinite(b))) return "";
        if (a + 0.01 < b) return "You sit " + Math.abs(a - b).toFixed(2) + " below the comps median, and " + belowCount + " of six categories are carrying that gap.";
        return "You sit at or above the comps median across " + (cats.length - belowCount) + " of " + cats.length + " categories.";
      })(),
      listKicker: cats.filter(c => c.below).length > 0 ? "Weakest categories first" : "Every category, strongest gap first",
      supportLine: ratingsLive
        ? "Every category Airbnb scores you on, next to the median for nearby comps with the same bed count. Same guests, same market, different numbers."
        : "Category scores are pulled from your Airbnb listing when the audit runs. The numbers below are illustrative until yours load.",
      footnote: "Your scores come straight from the Airbnb URL you submitted. The market bar is the median of nearby comps with the same bed count — a rating gap is a signal to look at, not a revenue promise.",
      calendar,
      phaseFigures,
      paidPackLive: Boolean(paid),
      paidPackLoading: Boolean(this.state.enrichingPaid),
      paidPackMissing: Boolean(this.state.unlocked && !paid && !this.state.enrichingPaid),

      paidForwardRows,
      paidPaceRows,
      hasPaidMarket: paidMarketRows.length > 0,
      hasPaidForward: paidForwardRows.length > 0,
      hasPaidPace: paidPaceRows.length > 0,
      calendarSourceNote: paidMonthly.length
        ? "Live 12-month history from AirROI for this listing."
        : "Trailing ADR and occupancy from your listing, held flat until the paid AirROI history pack loads.",
      paidCostNote: paid
        ? (this.state.unlockMode === "mock" || Number(paid.estimatedCostUsd) === 0
          ? "Mock paid pack · $0 AirROI cost (AIRBNB1234 test mode)"
          : ("AirROI pack loaded · about $" + Number(paid.estimatedCostUsd || 0).toFixed(2) + " in API cost for this unlock"))
        : "",
      currentMonthly: this.money(base),
      pendingComps: base <= 0,
      hasLiveComps: Array.isArray(this.state.liveComps) && this.state.liveComps.length > 0,
      noLiveComps: this.state.audited && !this.state.pulling && !(Array.isArray(this.state.liveComps) && this.state.liveComps.length > 0),
      compsLoading: Boolean(this.state.pulling),
      skeletons: [{ delay: "0s" }, { delay: "0.14s" }, { delay: "0.28s" }],
      subjectPhoto: Boolean(this.state.subject && this.state.subject.photoUrl),
      subjectNoPhoto: !(this.state.subject && this.state.subject.photoUrl),
      subjectPhotoUrl: (this.state.subject && this.state.subject.photoUrl) || "",
      behindLine: (function () {

        const nums = live.map((c) => c.monthlyNum != null ? c.monthlyNum : 0).filter((n) => n > 0);
        if (!nums.length || !(base > 0)) return "";
        const closest = Math.min.apply(null, nums);
        return this.money(closest - base) + " / mo behind the nearest comp";
      }).call(this),
      stackFootnote: this.state.pulling
        ? "Pulling the three closest comps and their trailing monthly revenue from market data."
        : (Array.isArray(this.state.liveComps) && this.state.liveComps.length

      runAuditLabel: this.state.pulling ? "Running your audit…" : "Run my audit",
      runAudit: () => this.startAudit(),
      pullData: () => this.startAudit()

  }
}

e=\"display: flex; align-items: flex-start; gap: 12px\">\n          <span style=\"flex: none; width: 20px; height: 20px; border-radius: 999px; background: #fff0f3; color: #d90b41; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; margin-top: 1px\">\u2713</span>\n          <div style=\"flex: 1; font-size: 14.5px; font-weight: 600; line-height: 1.4; min-width: 0\">A live walkthrough of your specific listing</div>\n          <div style=\"flex: none; font-size: 12.5px; font-weight: 700; color: #00a699\">Free 15-min call</div>\n        </div>\n      </div>\n      <div style=\"margin-top: 22px; padding-top: 18px; border-top: 1px solid #f0f0f0; font-size: 13px; color: #717171; font-weight: 500; line-height: 1.5\">\n        Questions first? <a href=\"mailto:info@mandelrealtygroup.com\">info@mandelrealtygroup.com</a>\n      </div>\n    </div>\n  </section>\n\n  <section id=\"basics\" style=\"margin-top: 72px; scroll-margin-top: 24px\">\n    <h2 style=\"margin: 0 0 10px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">Step 1 \u2014 tell us the basics</h2>\n    <p style=\"margin: 0 0 26px; font-size: 16.5px; line-height: 1.55; color: #5e5e5e; max-width: 72ch; text-wrap: pretty\">If you are already live on Airbnb, that is all we need \u2014 we will see everything else the moment we open your listing.</p>\n\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 26px\">\n      <div onClick=\"{{ pickLive }}\" style=\"{{ livePathStyle }}\" style-hover=\"border-color: #bdbdbd\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 8px\">\n          <span style=\"{{ liveDotStyle }}\"></span>\n          <div style=\"font-size: 16px; font-weight: 700\">I have a live Airbnb listing</div>\n        </div>\n        <div style=\"font-size: 14px; color: #717171; font-weight: 500; padding-left: 32px\">Just your link and contact info</div>\n      </div>\n      <div onClick=\"{{ pickNew }}\" style=\"{{ newPathStyle }}\" style-hover=\"border-color: #bdbdbd\">\n        <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 8px\">\n          <span style=\"{{ newDotStyle }}\"></span>\n          <div style=\"font-size: 16px; font-weight: 700\">Not listed yet / off-platform</div>\n        </div>\n        <div style=\"font-size: 14px; color: #717171; font-weight: 500; padding-left: 32px\">We will project from comparable listings</div>\n      </div>\n    </div>\n\n    <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 22px; padding: 30px; box-shadow: 0 12px 40px rgba(0,0,0,0.06)\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px\">\n        <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n          <span style=\"font-size: 13px; font-weight: 700\">Name</span>\n          <input type=\"text\" name=\"name\" onChange=\"{{ onField }}\" placeholder=\"Jordan Mandel\" style=\"{{ nameInputStyle }}\" />\n        </label>\n        <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n          <span style=\"font-size: 13px; font-weight: 700\">Phone</span>\n          <input type=\"tel\" name=\"phone\" onChange=\"{{ onField }}\" placeholder=\"(647) 000-0000\" style=\"{{ phoneInputStyle }}\" />\n        </label>\n        <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n          <span style=\"font-size: 13px; font-weight: 700\">Email</span>\n          <input type=\"email\" name=\"email\" onChange=\"{{ onField }}\" placeholder=\"you@email.com\" style=\"{{ emailInputStyle }}\" />\n        </label>\n      </div>\n\n      <sc-if value=\"{{ isLive }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"margin-top: 22px; padding-top: 22px; border-top: 1px solid #f0f0f0; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px\">\n          <label style=\"display: flex; flex-direction: column; gap: 7px; grid-column: 1 / -1; min-width: 0\">\n            <span style=\"font-size: 13px; font-weight: 700\">Airbnb listing link</span>\n            <input type=\"url\" name=\"listing\" onChange=\"{{ onField }}\" placeholder=\"https://www.airbnb.ca/rooms/...\" style=\"{{ listingInputStyle }}\" />\n          </label>\n          <div class=\"ra-live-pair\">\n            <div style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n              <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n                <span style=\"font-size: 13px; font-weight: 700\">Current average monthly revenue</span>\n                <input type=\"text\" name=\"revenue\" onChange=\"{{ onField }}\" placeholder=\"$3,200\" style=\"{{ revenueInputStyle }}\" />\n              </label>\n              <span style=\"font-size: 12.5px; color: #717171; font-weight: 500; line-height: 1.45\">Required for your gap and projection figures. MRG will still walk the numbers with you on the call.</span>\n            </div>\n            <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n              <span style=\"font-size: 13px; font-weight: 700\">Furniture &amp; d\u00e9cor <span style=\"font-weight: 500; color: #717171\">(optional)</span></span>\n              <select name=\"furniture\" onChange=\"{{ onField }}\" style=\"width: 100%; border: 1px solid #dddddd; border-radius: 12px; padding: 13px 15px; font-size: 15px; color: #222; background: #fff; appearance: none\">\n                <option>Not sure / prefer not to say</option>\n                <option>Fully furnished, recently refreshed</option>\n                <option>Furnished, but dated</option>\n                <option>Partly furnished</option>\n                <option>Empty \u2014 needs a full furnish</option>\n              </select>\n            </label>\n          </div>\n        </div>\n      </sc-if>\n\n      <sc-if value=\"{{ isNew }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"margin-top: 22px; padding-top: 22px; border-top: 1px solid #f0f0f0; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px\">\n          <label style=\"display: flex; flex-direction: column; gap: 7px; grid-column: 1 / -1; min-width: 0; position: relative\">\n            <span style=\"font-size: 13px; font-weight: 700\">Property address</span>\n            <input type=\"text\" name=\"address\" autocomplete=\"off\" autocapitalize=\"words\" spellcheck=\"false\" onChange=\"{{ onAddressField }}\" placeholder=\"Start typing an address…\" style=\"{{ addressInputStyle }}\" />\n            <div id=\"ra-places-dd\" role=\"listbox\" aria-label=\"Address suggestions\" style=\"display: none; position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 40; background: #fff; border: 1px solid #dddddd; border-radius: 12px; box-shadow: 0 12px 28px rgba(0,0,0,0.12); overflow: hidden; max-height: 260px; overflow-y: auto\"></div>\n          </label>\n          <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n            <span style=\"font-size: 13px; font-weight: 700\">Bedrooms</span>\n            <select name=\"bedrooms\" onChange=\"{{ onField }}\" style=\"width: 100%; border: 1px solid #dddddd; border-radius: 12px; padding: 13px 15px; font-size: 15px; color: #222; background: #fff; appearance: none\">\n              <option>Studio</option>\n              <option>1</option>\n              <option>1 + den</option>\n              <option>2</option>\n              <option>2 + den</option>\n              <option>3+</option>\n            </select>\n          </label>\n          <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n            <span style=\"font-size: 13px; font-weight: 700\">Bathrooms</span>\n            <select name=\"bathrooms\" onChange=\"{{ onField }}\" style=\"width: 100%; border: 1px solid #dddddd; border-radius: 12px; padding: 13px 15px; font-size: 15px; color: #222; background: #fff; appearance: none\">\n              <option>1</option>\n              <option>1.5</option>\n              <option>2</option>\n              <option>2.5+</option>\n            </select>\n          </label>\n          <label style=\"display: flex; flex-direction: column; gap: 7px; min-width: 0\">\n            <span style=\"font-size: 13px; font-weight: 700\">Market tier</span>\n            <select name=\"tier\" onChange=\"{{ onField }}\" style=\"width: 100%; border: 1px solid #dddddd; border-radius: 12px; padding: 13px 15px; font-size: 15px; color: #222; background: #fff; appearance: none\">\n              <option>Not sure \u2014 you tell me</option>\n              <option>Downtown core / prime</option>\n              <option>Mid-city / transit-close</option>\n              <option>Suburban</option>\n              <option>Cottage / seasonal</option>\n            </select>\n          </label>\n          <label style=\"display: flex; flex-direction: column; gap: 7px; grid-column: 1 / -1; min-width: 0\">\n            <span style=\"font-size: 13px; font-weight: 700\">Photos or floor plan <span style=\"font-weight: 500; color: #717171\">(optional)</span></span>\n            <textarea name=\"notes\" onChange=\"{{ onField }}\" rows=\"2\" placeholder=\"Paste a Dropbox / Google Drive link, or describe the layout \u2014 a den or nook we can convert into a sleep space usually moves the number most.\" style=\"width: 100%; border: 1px solid #dddddd; border-radius: 12px; padding: 13px 15px; font-size: 15px; color: #222; background: #fff; resize: vertical; line-height: 1.5\"></textarea>\n          </label>\n        </div>\n      </sc-if>\n\n      <div style=\"margin-top: 26px; padding-top: 22px; border-top: 1px solid #f0f0f0; display: flex; flex-wrap: wrap; align-items: center; gap: 14px\">\n        <button type=\"button\" onClick=\"{{ runAudit }}\" style=\"background: #ff385c; color: #fff; border: none; font-size: 16px; font-weight: 700; border-radius: 14px; padding: 15px 28px; cursor: pointer; box-shadow: 0 8px 20px rgba(255,56,92,0.28)\" style-hover=\"background: #e00b41\">{{ runAuditLabel }}</button>\n        <div style=\"flex: 1; min-width: 260px; font-size: 12.5px; color: #717171; font-weight: 500; line-height: 1.5\">Builds your projections from the numbers above and loads nearby Airbnb comps when live market data is available.</div>\n      </div>\n    </div>\n  </section>\n\n  <sc-if value=\"{{ audited }}\" hint-placeholder-val=\"{{ false }}\">\n  <section id=\"summary\" style=\"margin-top: 76px; scroll-margin-top: 24px\">\n    <h2 style=\"margin: 0 0 10px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">Your pace vs nearby comps</h2>\n    <p style=\"margin: 0 0 26px; font-size: 16.5px; line-height: 1.55; color: #5e5e5e; max-width: 76ch; text-wrap: pretty\">Conservative, moderate, and what a Mandel-optimized version of this listing could realistically earn \u2014 each with the implied nightly rate and occupancy behind it.</p>\n\n    <sc-if value=\"{{ hasRevenue }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px\">\n        <sc-for list=\"{{ tiers }}\" as=\"t\" hint-placeholder-count=\"3\">\n          <div style=\"{{ t.cardStyle }}\">\n            <div style=\"margin-bottom: 18px\">\n              <span style=\"font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase\">{{ t.label }}</span>\n            </div>\n            <div style=\"font-size: 38px; font-weight: 800; letter-spacing: -0.035em; line-height: 1\">{{ t.annual }}</div>\n            <div style=\"font-size: 13.5px; font-weight: 600; opacity: 0.72; margin-top: 6px\">{{ t.monthly }} / month</div>\n            <div style=\"margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(128,128,128,0.22); display: flex; gap: 22px\">\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <span style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.6\">Nightly</span>\n                <span style=\"font-size: 16px; font-weight: 700\">{{ t.nightly }}</span>\n              </div>\n              <div style=\"display: flex; flex-direction: column; gap: 4px\">\n                <span style=\"font-size: 11.5px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; opacity: 0.6\">Occupancy</span>\n                <span style=\"font-size: 16px; font-weight: 700\">{{ t.occ }}</span>\n              </div>\n            </div>\n            <div style=\"margin-top: 14px; font-size: 13px; font-weight: 500; line-height: 1.45; opacity: 0.78\">{{ t.note }}</div>\n          </div>\n        </sc-for>\n        <div style=\"background: #fff0f3; border: 1px solid #ffd3dd; border-radius: 20px; padding: 26px\">\n          <div style=\"font-size: 12.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; color: #d90b41; margin-bottom: 18px\">Annual gap</div>\n          <div style=\"font-size: 38px; font-weight: 800; letter-spacing: -0.035em; line-height: 1; color: #d90b41\">{{ gapAnnual }}</div>\n          <div style=\"font-size: 13.5px; font-weight: 600; color: #b00832; margin-top: 6px\">{{ gapMonthly }} / month left on the table</div>\n          <div style=\"margin-top: 18px; padding-top: 16px; border-top: 1px solid #ffd3dd; font-size: 13px; font-weight: 500; line-height: 1.5; color: #8f2440\">Conservative today vs. a Mandel-optimized version of the same unit. We walk through every line of it on your free 15-min call.</div>\n        </div>\n      </div>\n    </sc-if>\n\n    <sc-if value=\"{{ pending }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"background: #f7f7f7; border: 1px dashed #d6d6d6; border-radius: 22px; padding: 34px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px\">\n        <div style=\"flex: 1; min-width: 280px\">\n          <div style=\"font-size: 21px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 8px\">We need one number to lock your tiers in.</div>\n          <div style=\"font-size: 15.5px; line-height: 1.55; color: #5e5e5e; max-width: 60ch; text-wrap: pretty\">Enter your current average monthly revenue above \u2014 or book a free call and MRG will confirm it from the listing with you, live.</div>\n        </div>\n        <div style=\"display: flex; flex-wrap: wrap; gap: 12px\">\n          <a href=\"#basics\" style=\"background: #222222; color: #fff; font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 24px\" style-hover=\"background: #000; color: #fff; text-decoration: none\">Enter revenue</a>\n          <a href=\"tel:+16473817325\" style=\"background: #ffffff; color: #222; border: 1px solid #dddddd; font-size: 15px; font-weight: 700; border-radius: 14px; padding: 14px 24px\" style-hover=\"border-color: #222222; color: #222; text-decoration: none\">Book the free call</a>\n        </div>\n      </div>\n    </sc-if>\n\n    <div style=\"margin-top: 20px; background: #222222; color: #ffffff; border-radius: 22px; padding: 30px; display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 26px; align-items: center\">\n      <div style=\"min-width: 0\">\n        <p style=\"margin: 0; font-size: 16px; line-height: 1.6; color: #eaeaea; text-wrap: pretty\">A 2BR+den condo MRG took over made <strong style=\"color: #fff\">$26,995 in all of 2025</strong>. After a furniture refresh and converting an unused den into a sleep space, it booked <strong style=\"color: #fff\">over $30,000 in the first two months alone</strong> \u2014 on pace for a projected revenue of <strong style=\"color: #fff\">$140K YOY</strong>.</p>\n      </div>\n      <div style=\"display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; min-width: 0\">\n        <div style=\"background: #2e2e2e; border-radius: 16px; padding: 16px\">\n          <div style=\"font-size: 22px; font-weight: 800; letter-spacing: -0.03em\">$26,995</div>\n          <div style=\"font-size: 11.5px; font-weight: 600; color: #a5a5a5; margin-top: 5px; line-height: 1.35\">All of 2025, before MRG</div>\n        </div>\n        <div style=\"background: #2e2e2e; border-radius: 16px; padding: 16px\">\n          <div style=\"font-size: 22px; font-weight: 800; letter-spacing: -0.03em\">$30K+</div>\n          <div style=\"font-size: 11.5px; font-weight: 600; color: #a5a5a5; margin-top: 5px; line-height: 1.35\">First two months after</div>\n        </div>\n        <div style=\"background: #ff385c; border-radius: 16px; padding: 16px\">\n          <div style=\"font-size: 22px; font-weight: 800; letter-spacing: -0.03em\">$140K</div>\n          <div style=\"font-size: 11.5px; font-weight: 600; color: #ffe0e7; margin-top: 5px; line-height: 1.35\">Projected YOY pace</div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n    <section style=\"margin-top: 76px\">\n    <h2 style=\"margin: 0 0 10px; font-size: clamp(26px, 4vw, 34px); font-weight: 800; letter-spacing: -0.03em\">How you stack up</h2>\n    <p style=\"margin: 0 0 24px; font-size: 16.5px; line-height: 1.55; color: #5e5e5e; max-width: 76ch; text-wrap: pretty\">Same idea as a realtor's CMA, built for Airbnb: your property placed next to what similar listings nearby are actually earning — not asking, earning.</p>\n\n    <div class=\"ra-stack-grid\">\n      <div style=\"background: #222222; color: #ffffff; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; animation: mrgRise .5s cubic-bezier(.2,.7,.2,1) both\">\n        <sc-if value=\"{{ subjectPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position: relative; width: 100%; aspect-ratio: 4 / 3; background: #2e2e2e\">\n            <img src=\"{{ subjectPhotoUrl }}\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.style.display='none'\" />\n            <div style=\"position: absolute; left: 14px; top: 14px; background: rgba(0,0,0,0.72); color: #ffffff; font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 7px 12px; pointer-events: none\">Your property</div>\n          </div>\n        </sc-if>\n        <sc-if value=\"{{ subjectNoPhoto }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"position: relative; width: 100%; aspect-ratio: 4 / 3; background: #2b2b2b; display: flex; flex-direction: column; justify-content: flex-end; padding: 18px\">\n            <div style=\"position: absolute; left: 14px; top: 14px; background: #3a3a3a; color: #ffffff; font-size: 11.5px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; border-radius: 999px; padding: 7px 12px\">Your property</div>\n            <div style=\"font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 1\">{{ currentMonthly }}</div>\n            <div style=\"font-size: 13px; font-weight: 600; color: #a5a5a5; margin-top: 6px\">per month, current pace</div>\n          </div>\n        </sc-if>\n        <div style=\"padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1\">\n          <sc-if value=\"{{ subjectPhoto }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <div style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1\">{{ currentMonthly }}</div>\n              <div style=\"font-size: 12.5px; font-weight: 600; color: #a5a5a5; margin-top: 5px\">per month, current pace</div>\n            </div>\n          </sc-if>\n          <div style=\"font-size: 15.5px; font-weight: 700; line-height: 1.35\">Your listing, as it stands today</div>\n          <div style=\"font-size: 13px; font-weight: 500; color: #a5a5a5\">From your intake above</div>\n          <sc-if value=\"{{ hasLiveComps }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin-top: auto; padding-top: 14px; border-top: 1px solid #3a3a3a; font-size: 13px; font-weight: 700; color: #ff8fa4; line-height: 1.4\">{{ behindLine }}</div>\n          </sc-if>\n        </div>\n      </div>\n\n      <sc-if value=\"{{ hasLiveComps }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ comps }}\" as=\"c\" hint-placeholder-count=\"3\">\n          <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.05); display: flex; flex-direction: column; animation: mrgRise .55s cubic-bezier(.2,.7,.2,1) both; animation-delay: {{ c.delay }}\">\n            <div style=\"position: relative; width: 100%; aspect-ratio: 4 / 3; background: #f2f2f2\">\n              <img src=\"{{ c.photoUrl }}\" alt=\"\" style=\"width: 100%; height: 100%; object-fit: cover; display: block\" loading=\"lazy\" referrerpolicy=\"no-referrer\" onerror=\"this.parentNode.style.background='#ebebeb'\" />\n              <div style=\"position: absolute; left: 12px; top: 12px; display: flex; gap: 6px; pointer-events: none\">\n                <sc-if value=\"{{ c.hasBadge }}\" hint-placeholder-val=\"{{ true }}\">\n                  <span style=\"background: #ffffff; color: #222222; font-size: 11px; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; border-radius: 999px; padding: 6px 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.18)\">{{ c.badge }}</span>\n                </sc-if>\n              </div>\n              <sc-if value=\"{{ c.hasRating }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"position: absolute; right: 12px; top: 12px; background: rgba(34,34,34,0.82); color: #ffffff; font-size: 11.5px; font-weight: 700; border-radius: 999px; padding: 6px 10px; pointer-events: none\">★ {{ c.rating }}</div>\n              </sc-if>\n            </div>\n            <div style=\"padding: 18px; display: flex; flex-direction: column; gap: 8px; flex: 1\">\n              <div style=\"font-size: 15.5px; font-weight: 700; line-height: 1.35\">{{ c.title }}</div>\n              <div style=\"font-size: 12.5px; font-weight: 600; color: #717171\">{{ c.meta }}</div>\n              <div style=\"display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-top: 4px\">\n                <span style=\"font-size: 30px; font-weight: 800; letter-spacing: -0.035em; line-height: 1\">{{ c.monthly }}</span>\n                <span style=\"font-size: 12px; font-weight: 600; color: #717171\">/ mo earned</span>\n              </div>\n              <div style=\"align-self: flex-start; background: #f0fbfa; color: #00806f; font-size: 12.5px; font-weight: 800; border-radius: 999px; padding: 6px 11px\">{{ c.delta }} vs. you</div>\n              <div style=\"margin-top: auto; padding-top: 14px; border-top: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px\">\n                <span style=\"flex: 1; min-width: 0; font-size: 12.5px; font-weight: 600; color: #444444; line-height: 1.4; filter: blur(3.6px); user-select: none; white-space: nowrap; overflow: hidden\">{{ c.lockedTeaser }}</span>\n                <span style=\"flex: none; font-size: 11px; font-weight: 800; letter-spacing: 0.05em; text-transform: uppercase; color: #b0b0b0\">Locked</span>\n              </div>\n            </div>\n          </div>\n        </sc-for>\n      </sc-if>\n\n      <sc-if value=\"{{ compsLoading }}\" hint-placeholder-val=\"{{ false }}\">\n        <sc-for list=\"{{ skeletons }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"background: #ffffff; border: 1px solid #ebebeb; border-radius: 20px; overflow: hidden; box-shadow: 0 8px 24px rgba(0,0,0,0.04); display: flex; flex-direction: column\">\n            <div style=\"width: 100%; aspect-ratio: 4 / 3; background: linear-gradient(100deg, #f2f2f2 30%, #fafafa 5
